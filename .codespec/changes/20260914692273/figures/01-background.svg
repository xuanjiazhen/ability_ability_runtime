<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#F7F9FC"/><text x="547.4" y="66" font-family="Microsoft YaHei" font-size="42" fill="#1A3A6B" font-weight="bold">需求背景：AI 任务管理的优先级与归属问题</text><text x="475.8" y="108" font-family="Microsoft YaHei" font-size="24" fill="#5F6368" font-weight="normal">20260914692273 · 任务优先级系统判定、多任务并发与进程多任务归属（按最高优先级）</text><rect x="60" y="150" width="620" height="620" rx="16" fill="#FFFFFF" stroke="#80868B" stroke-width="2"/><rect x="90" y="180" width="8" height="38" rx="4" fill="#4472C4"/><text x="112" y="210" font-family="Microsoft YaHei" font-size="30" fill="#1A3A6B" font-weight="bold">现状与痛点</text><rect x="90" y="250" width="560" height="150" rx="10" fill="#FAFBFC" stroke="#EA4335" stroke-width="2"/><text x="110" y="290" font-family="Microsoft YaHei" font-size="26" fill="#EA4335" font-weight="bold">① 优先级由调用方指定</text><text x="110" y="328" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">startTask(taskId, priority?) 由 AI 语音助手传入优先级</text><text x="110" y="362" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">助手无法感知自身前后台状态与系统负载，管控强度与系统真实状态不匹配</text><rect x="90" y="422" width="560" height="150" rx="10" fill="#FAFBFC" stroke="#F29900" stroke-width="2"/><text x="110" y="462" font-family="Microsoft YaHei" font-size="26" fill="#F29900" font-weight="bold">② 多任务并发</text><text x="110" y="500" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">AI 助手可同时执行多个任务，任务事件并发产生</text><text x="110" y="534" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">缺乏并发基线与并发安全设计（≤10 基线）</text><rect x="90" y="594" width="560" height="150" rx="10" fill="#FAFBFC" stroke="#9334E6" stroke-width="2"/><text x="110" y="634" font-family="Microsoft YaHei" font-size="26" fill="#9334E6" font-weight="bold">③ 进程多任务归属</text><text x="110" y="672" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">同一进程可能被多个任务共用纳管</text><text x="110" y="706" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">无档位合并与降级规则：管控冲突、豁免泄漏</text><line x1="700" y1="460" x2="830" y2="460" stroke="#4472C4" stroke-width="4"/><path d="M 860 460 L 835 450 L 835 470 Z" fill="#4472C4"/><text x="754.0" y="420" font-family="Microsoft YaHei" font-size="26" fill="#4472C4" font-weight="bold">解决</text><rect x="880" y="150" width="980" height="620" rx="16" fill="#FFFFFF" stroke="#4472C4" stroke-width="2"/><rect x="910" y="180" width="8" height="38" rx="4" fill="#4472C4"/><text x="932" y="210" font-family="Microsoft YaHei" font-size="30" fill="#1A3A6B" font-weight="bold">本需求目标（FEAT-AI-TASK-MGR-001 拆分之一）</text><circle cx="945" cy="272" r="20" fill="#34A853"/><text x="938.4" y="280" font-family="Microsoft YaHei" font-size="24" fill="#FFFFFF" font-weight="bold">1</text><text x="985" y="282" font-family="Microsoft YaHei" font-size="26" fill="#34A853" font-weight="bold">任务优先级系统判定</text><text x="985" y="320" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">系统感知前后台状态 × 系统负载自动判定档位（HIGH/MEDIUM/LOW），创建时判定、运行中动态重判</text><circle cx="945" cy="400" r="20" fill="#4472C4"/><text x="938.4" y="408" font-family="Microsoft YaHei" font-size="24" fill="#FFFFFF" font-weight="bold">2</text><text x="985" y="410" font-family="Microsoft YaHei" font-size="26" fill="#4472C4" font-weight="bold">startTask 接口变更</text><text x="985" y="448" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">移除 priority 可选入参（原 20260914692191 交付接口），由本需求承载</text><circle cx="945" cy="528" r="20" fill="#F29900"/><text x="938.4" y="536" font-family="Microsoft YaHei" font-size="24" fill="#FFFFFF" font-weight="bold">3</text><text x="985" y="538" font-family="Microsoft YaHei" font-size="26" fill="#F29900" font-weight="bold">多任务并发</text><text x="985" y="576" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">≤10 并发任务设计基线（系统参数可配），任务事件并发处理经锁保证无竞态</text><circle cx="945" cy="656" r="20" fill="#9334E6"/><text x="938.4" y="664" font-family="Microsoft YaHei" font-size="24" fill="#FFFFFF" font-weight="bold">4</text><text x="985" y="666" font-family="Microsoft YaHei" font-size="26" fill="#9334E6" font-weight="bold">进程多任务归属</text><text x="985" y="704" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">按最高优先级任务管控；最高档结束降次高；全部结束完全恢复；死亡清理（≤1s）任务不自动结束</text><rect x="60" y="810" width="1800" height="230" rx="16" fill="#EEF1F4" stroke="#80868B" stroke-width="2"/><rect x="90" y="838" width="8" height="38" rx="4" fill="#4472C4"/><text x="112" y="868" font-family="Microsoft YaHei" font-size="30" fill="#1A3A6B" font-weight="bold">需求拆分边界（与本需求的关系）</text><rect x="90" y="890" width="380" height="130" rx="10" fill="#FFFFFF" stroke="#80868B" stroke-width="2"/><text x="106" y="926" font-family="Microsoft YaHei" font-size="21" fill="#1A3A6B" font-weight="bold">20260914692191</text><text x="106" y="958" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">任务生命周期 / startTask 基线</text><text x="106" y="992" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">已合入 master，本需求消费并承载入参变更</text><rect x="490" y="890" width="420" height="130" rx="10" fill="#E8F0FE" stroke="#4472C4" stroke-width="2"/><text x="506" y="926" font-family="Microsoft YaHei" font-size="21" fill="#1A3A6B" font-weight="bold">20260914692273（本需求）</text><text x="506" y="958" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">判定 + 并发 + 归属 + dump</text><text x="506" y="992" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">优先级判定 / ≤10 并发 / 最高档合并与降级 / 死亡清理</text><rect x="930" y="890" width="380" height="130" rx="10" fill="#FFFFFF" stroke="#80868B" stroke-width="2"/><text x="946" y="926" font-family="Microsoft YaHei" font-size="21" fill="#1A3A6B" font-weight="bold">20260914692272</text><text x="946" y="958" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">RSS 档位施加 / 撤销</text><text x="946" y="992" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">本需求先交付：调用留空桩，事件流已输出，其后接入</text><rect x="1330" y="890" width="500" height="130" rx="10" fill="#FFFFFF" stroke="#80868B" stroke-width="2"/><text x="1346" y="926" font-family="Microsoft YaHei" font-size="21" fill="#1A3A6B" font-weight="bold">20260914692192~194</text><text x="1346" y="958" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">纳管通道（UIAbility/CLI/Agent/意图）</text><text x="1346" y="992" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">集成用例先行 dump 调试钩子，通道交付后补真实链路</text></svg>