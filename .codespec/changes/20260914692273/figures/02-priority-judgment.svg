<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#F7F9FC"/><text x="589.3" y="66" font-family="Microsoft YaHei" font-size="42" fill="#1A3A6B" font-weight="bold">任务优先级系统判定：现状 → 变更方案</text><text x="431.4" y="108" font-family="Microsoft YaHei" font-size="24" fill="#5F6368" font-weight="normal">输入：调用方前后台状态（前台 Ability 口径）× 系统负载融合档位（0~7）→ HIGH/MEDIUM/LOW</text><rect x="60" y="150" width="560" height="620" rx="16" fill="#FFFFFF" stroke="#80868B" stroke-width="2"/><rect x="90" y="180" width="8" height="38" rx="4" fill="#4472C4"/><text x="112" y="210" font-family="Microsoft YaHei" font-size="30" fill="#1A3A6B" font-weight="bold">变更前（现状，20260914692191）</text><text x="100" y="260" font-family="Microsoft YaHei" font-size="24" fill="#5F6368" font-weight="bold">接口签名</text><text x="100" y="298" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">startTask(taskId, priority?: TaskPriority)</text><text x="100" y="352" font-family="Microsoft YaHei" font-size="24" fill="#5F6368" font-weight="bold">档位来源</text><text x="100" y="390" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">调用方指定；未传默认 MEDIUM(200)</text><text x="100" y="444" font-family="Microsoft YaHei" font-size="24" fill="#5F6368" font-weight="bold">系统感知</text><text x="100" y="482" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">不感知前后台状态与系统负载</text><text x="100" y="536" font-family="Microsoft YaHei" font-size="24" fill="#5F6368" font-weight="bold">问题</text><text x="100" y="574" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">档位与系统真实状态可能脱节；调用方无法感知负载</text><rect x="90" y="620" width="500" height="110" rx="10" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/><text x="110" y="660" font-family="Microsoft YaHei" font-size="22" fill="#EA4335" font-weight="bold">AI 语音助手无法感知系统负载</text><text x="110" y="700" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">管控强度与系统当前状态不匹配</text><line x1="640" y1="460" x2="770" y2="460" stroke="#4472C4" stroke-width="4"/><path d="M 800 460 L 775 450 L 775 470 Z" fill="#4472C4"/><text x="694.0" y="420" font-family="Microsoft YaHei" font-size="26" fill="#4472C4" font-weight="bold">变更</text><rect x="820" y="150" width="1040" height="620" rx="16" fill="#FFFFFF" stroke="#4472C4" stroke-width="2"/><rect x="850" y="180" width="8" height="38" rx="4" fill="#4472C4"/><text x="872" y="210" font-family="Microsoft YaHei" font-size="30" fill="#1A3A6B" font-weight="bold">变更后（本需求）：系统判定</text><rect x="850" y="235" width="480" height="120" rx="10" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/><text x="870" y="272" font-family="Microsoft YaHei" font-size="23" fill="#34A853" font-weight="bold">判定输入 ① 前后台状态</text><text x="870" y="306" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">调用方进程存在前台 Ability 即前台</text><text x="870" y="338" font-family="Microsoft YaHei" font-size="20" fill="#5F6368" font-weight="normal">（Ability 维度，非进程维度）</text><rect x="1360" y="235" width="470" height="120" rx="10" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/><text x="1380" y="272" font-family="Microsoft YaHei" font-size="23" fill="#34A853" font-weight="bold">判定输入 ② 融合档位 0~7</text><text x="1380" y="306" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">性能功耗热融合档位（热档位+CPU 负载</text><text x="1380" y="338" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">+叠加场景综合），ressched_client 接入</text><text x="850" y="410" font-family="Microsoft YaHei" font-size="24" fill="#1A3A6B" font-weight="bold">判定矩阵（编译期默认，调整走版本迭代）</text><rect x="850" y="430" width="620" height="62" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/><text x="872" y="470" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">前台（存在前台 Ability）</text><rect x="1500" y="430" width="330" height="62" rx="8" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/><text x="1563.8" y="470" font-family="Microsoft YaHei" font-size="22" fill="#34A853" font-weight="bold">HIGH（与负载无关）</text><rect x="850" y="504" width="620" height="62" rx="8" fill="#FEF3E2" stroke="#F29900" stroke-width="2"/><text x="872" y="544" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">后台 × 融合档位 0~4（低负载）</text><rect x="1500" y="504" width="330" height="62" rx="8" fill="#FFFFFF" stroke="#F29900" stroke-width="2"/><text x="1628.7" y="544" font-family="Microsoft YaHei" font-size="22" fill="#F29900" font-weight="bold">MEDIUM</text><rect x="850" y="578" width="620" height="62" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/><text x="872" y="618" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">后台 × 融合档位 5~7（高负载）</text><rect x="1500" y="578" width="330" height="62" rx="8" fill="#FFFFFF" stroke="#EA4335" stroke-width="2"/><text x="1646.8" y="618" font-family="Microsoft YaHei" font-size="22" fill="#EA4335" font-weight="bold">LOW</text><rect x="850" y="662" width="480" height="92" rx="10" fill="#FFFFFF" stroke="#F29900" stroke-width="2"/><text x="870" y="696" font-family="Microsoft YaHei" font-size="22" fill="#F29900" font-weight="bold">兜底：感知失败 → MEDIUM</text><text x="870" y="730" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">监听注册失败 / 回调数据获取失败</text><rect x="1360" y="662" width="470" height="92" rx="10" fill="#FFFFFF" stroke="#4472C4" stroke-width="2"/><text x="1380" y="696" font-family="Microsoft YaHei" font-size="22" fill="#4472C4" font-weight="bold">动态重判：事件驱动</text><text x="1380" y="730" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">前后台切换/档位跳变触发；档位不变不重算（防抖）</text><rect x="60" y="810" width="1800" height="230" rx="16" fill="#E8F0FE" stroke="#4472C4" stroke-width="2"/><rect x="90" y="838" width="8" height="38" rx="4" fill="#4472C4"/><text x="112" y="868" font-family="Microsoft YaHei" font-size="30" fill="#1A3A6B" font-weight="bold">验收标准关联（spec AC / 规则）</text><text x="100" y="892" font-family="Microsoft YaHei" font-size="22" fill="#4472C4" font-weight="bold">AC-6.5</text><text x="220" y="892" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">创建任务时系统判定档位并立即激活，经 dump 可观测</text><text x="1330" y="892" font-family="Microsoft YaHei" font-size="21" fill="#5F6368" font-weight="normal">VM-1 单测+集成 demo</text><text x="100" y="932" font-family="Microsoft YaHei" font-size="22" fill="#4472C4" font-weight="bold">AC-6.6</text><text x="220" y="932" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">各组合判定档位符合映射矩阵（前台/后台 × 档位低/高，含边界 4/5）</text><text x="1330" y="932" font-family="Microsoft YaHei" font-size="21" fill="#5F6368" font-weight="normal">VM-2 判定矩阵单测</text><text x="100" y="972" font-family="Microsoft YaHei" font-size="22" fill="#4472C4" font-weight="bold">AC-6.7</text><text x="220" y="972" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">运行中前后台/负载变化动态重判，进程档位随归属实时重算</text><text x="1330" y="972" font-family="Microsoft YaHei" font-size="21" fill="#5F6368" font-weight="normal">VM-3 单测场景矩阵+集成</text><text x="100" y="1030" font-family="Microsoft YaHei" font-size="20" fill="#5F6368" font-weight="normal">规则：R-1 系统判定与三档；R-7 感知失败兜底 MEDIUM（spec 规则定义）</text></svg>