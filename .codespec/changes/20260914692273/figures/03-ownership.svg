<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#F7F9FC"/><text x="645.0" y="66" font-family="Microsoft YaHei" font-size="42" fill="#1A3A6B" font-weight="bold">多任务并发与进程多任务归属机制</text><text x="450.6" y="108" font-family="Microsoft YaHei" font-size="24" fill="#5F6368" font-weight="normal">并发基线 ≤10 · 进程实际管控档位 = 纳管任务中最高档 · 降级重算 · 死亡清理 · 豁免幂等</text><rect x="60" y="150" width="560" height="240" rx="16" fill="#FFFFFF" stroke="#F29900" stroke-width="2"/><rect x="90" y="180" width="8" height="38" rx="4" fill="#4472C4"/><text x="112" y="210" font-family="Microsoft YaHei" font-size="30" fill="#1A3A6B" font-weight="bold">并发基线（AC-6.4）</text><text x="100" y="245" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">· ≤10 并发任务（系统参数可配）</text><text x="100" y="283" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">· 任务事件并发处理，互斥锁保证无竞态</text><text x="100" y="321" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">· 第 11 个任务创建被拒绝（对外可观察错误）</text><rect x="60" y="420" width="560" height="350" rx="16" fill="#FFFFFF" stroke="#9334E6" stroke-width="2"/><rect x="90" y="450" width="8" height="38" rx="4" fill="#4472C4"/><text x="112" y="480" font-family="Microsoft YaHei" font-size="30" fill="#1A3A6B" font-weight="bold">归属关键机制</text><text x="100" y="515" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">· 双向索引：taskToPids_ / pidToTasks_</text><text x="100" y="553" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">· 豁免幂等键：taskId + pid + 豁免类型</text><text x="100" y="591" font-family="Microsoft YaHei" font-size="21" fill="#5F6368" font-weight="normal">  （pid 维度引用计数，按剩余任务重算）</text><text x="100" y="629" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">· 死亡清理：既有通知链感知 ≤1s</text><text x="100" y="667" font-family="Microsoft YaHei" font-size="21" fill="#5F6368" font-weight="normal">  移除索引 + 释放豁免，任务不自动结束</text><text x="100" y="705" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="normal">· 对 RSS 通知：注册/死亡/升档立即，降档合并 1s</text><rect x="660" y="150" width="1200" height="620" rx="16" fill="#FFFFFF" stroke="#4472C4" stroke-width="2"/><rect x="690" y="180" width="8" height="38" rx="4" fill="#4472C4"/><text x="712" y="210" font-family="Microsoft YaHei" font-size="30" fill="#1A3A6B" font-weight="bold">归属合并示意（同一进程被多个任务纳管）</text><rect x="700" y="250" width="300" height="110" rx="10" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/><text x="802.5" y="295" font-family="Microsoft YaHei" font-size="26" fill="#34A853" font-weight="bold">任务 T1</text><text x="795.5" y="330" font-family="Microsoft YaHei" font-size="22" fill="#34A853" font-weight="normal">HIGH(300)</text><rect x="700" y="390" width="300" height="110" rx="10" fill="#FCE8E6" stroke="#EA4335" stroke-width="2"/><text x="802.5" y="435" font-family="Microsoft YaHei" font-size="26" fill="#EA4335" font-weight="bold">任务 T2</text><text x="801.6" y="470" font-family="Microsoft YaHei" font-size="22" fill="#EA4335" font-weight="normal">LOW(100)</text><rect x="1150" y="300" width="300" height="150" rx="10" fill="#E8F0FE" stroke="#4472C4" stroke-width="2"/><text x="1256.6" y="355" font-family="Microsoft YaHei" font-size="28" fill="#4472C4" font-weight="bold">进程 P</text><text x="1190.0" y="395" font-family="Microsoft YaHei" font-size="20" fill="#5F6368" font-weight="normal">effectiveLevel = max</text><text x="1227.4" y="425" font-family="Microsoft YaHei" font-size="24" fill="#4472C4" font-weight="bold">= HIGH(300)</text><line x1="1010" y1="305" x2="1110" y2="305" stroke="#34A853" stroke-width="3"/><path d="M 1140 305 L 1115 295 L 1115 315 Z" fill="#34A853"/><line x1="1010" y1="445" x2="1110" y2="445" stroke="#EA4335" stroke-width="3"/><path d="M 1140 445 L 1115 435 L 1115 455 Z" fill="#EA4335"/><rect x="1520" y="250" width="320" height="300" rx="10" fill="#EEF1F4" stroke="#80868B" stroke-width="2"/><text x="1540" y="292" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="bold">T1 结束（最高档）</text><text x="1540" y="330" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">→ P 降至次高 T2 档</text><text x="1540" y="362" font-family="Microsoft YaHei" font-size="22" fill="#F29900" font-weight="bold">  LOW(100)</text><text x="1540" y="410" font-family="Microsoft YaHei" font-size="22" fill="#202124" font-weight="bold">T2 结束（最后一档）</text><text x="1540" y="448" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">→ P 完全恢复原调度</text><text x="1540" y="480" font-family="Microsoft YaHei" font-size="21" fill="#5F6368" font-weight="normal">  （RSS 自然回冻）</text><text x="1540" y="522" font-family="Microsoft YaHei" font-size="20" fill="#5F6368" font-weight="normal">全程：dump 可观测</text><line x1="1460" y1="375" x2="1480" y2="375" stroke="#5F6368" stroke-width="3"/><path d="M 1510 375 L 1485 365 L 1485 385 Z" fill="#5F6368"/><rect x="60" y="810" width="1800" height="230" rx="16" fill="#E8F0FE" stroke="#4472C4" stroke-width="2"/><rect x="90" y="838" width="8" height="38" rx="4" fill="#4472C4"/><text x="112" y="868" font-family="Microsoft YaHei" font-size="30" fill="#1A3A6B" font-weight="bold">验收标准关联（spec AC / 规则）</text><text x="100" y="890" font-family="Microsoft YaHei" font-size="22" fill="#4472C4" font-weight="bold">AC-6.1</text><text x="220" y="890" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">进程按纳管任务中最高档管控</text><text x="1010" y="890" font-family="Microsoft YaHei" font-size="21" fill="#5F6368" font-weight="normal">VM-4 单测+集成（dump 断言 effectiveLevel）</text><text x="100" y="928" font-family="Microsoft YaHei" font-size="22" fill="#4472C4" font-weight="bold">AC-6.2</text><text x="220" y="928" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">最高档结束降次高；全部结束完全恢复</text><text x="1010" y="928" font-family="Microsoft YaHei" font-size="21" fill="#5F6368" font-weight="normal">VM-5 单测+集成（dump 复核降级序列）</text><text x="100" y="966" font-family="Microsoft YaHei" font-size="22" fill="#4472C4" font-weight="bold">AC-6.3</text><text x="220" y="966" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">死亡清理 ≤1s、豁免释放、任务存续</text><text x="1010" y="966" font-family="Microsoft YaHei" font-size="21" fill="#5F6368" font-weight="normal">VM-6/VM-9 单测+集成（时延打点）</text><text x="100" y="1004" font-family="Microsoft YaHei" font-size="22" fill="#4472C4" font-weight="bold">AC-6.4</text><text x="220" y="1004" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">10 并发任务矩阵无竞态、无豁免泄漏</text><text x="1010" y="1004" font-family="Microsoft YaHei" font-size="21" fill="#5F6368" font-weight="normal">VM-7 并发单测+集成</text><text x="100" y="1030" font-family="Microsoft YaHei" font-size="20" fill="#5F6368" font-weight="normal">规则：R-2 最高档合并；R-3 降级重算；R-4 豁免幂等；R-5 死亡清理；R-6 并发上限；R-8 全部进程死亡任务存续</text></svg>