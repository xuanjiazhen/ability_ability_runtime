<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" fill="#F7F9FC"/><text x="624.0" y="66" font-family="Microsoft YaHei" font-size="42" fill="#1A3A6B" font-weight="bold">测试验证视角：观测通道与验证矩阵</text><text x="453.6" y="108" font-family="Microsoft YaHei" font-size="24" fill="#5F6368" font-weight="normal">dump 先行（--task / --task psched）· hilog 关键路径 · 集成用例先行 dump 调试钩子</text><rect x="60" y="150" width="640" height="880" rx="16" fill="#FFFFFF" stroke="#34A853" stroke-width="2"/><rect x="90" y="180" width="8" height="38" rx="4" fill="#4472C4"/><text x="112" y="210" font-family="Microsoft YaHei" font-size="30" fill="#1A3A6B" font-weight="bold">观测通道（端到端确认）</text><text x="100" y="245" font-family="Microsoft YaHei" font-size="23" fill="#34A853" font-weight="bold">1. hidumper -s 501 --task</text><text x="120" y="280" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">任务记录 + 任务自身判定档位</text><text x="100" y="330" font-family="Microsoft YaHei" font-size="23" fill="#34A853" font-weight="bold">2. hidumper -s 501 --task psched</text><text x="120" y="365" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">归属索引 / effectiveLevel / 豁免明细</text><text x="120" y="395" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">/ 判定器缓存（前台计数/融合档位）</text><text x="100" y="445" font-family="Microsoft YaHei" font-size="23" fill="#34A853" font-weight="bold">3. hilog 统一 TAG</text><text x="120" y="480" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">判定 / 重判 / 合并 / 降级 / 清理路径日志</text><text x="100" y="530" font-family="Microsoft YaHei" font-size="23" fill="#34A853" font-weight="bold">4. 集成用例先行 dump 调试钩子</text><text x="120" y="565" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">--task register/unregister &lt;taskId&gt; &lt;pid&gt;</text><text x="120" y="595" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">&lt;insight|cli|a2a|ability&gt;（master 已交付）</text><text x="100" y="645" font-family="Microsoft YaHei" font-size="23" fill="#34A853" font-weight="bold">5. 调度策略查询（RSS 侧）</text><text x="120" y="680" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">20260914692272 接入后生效，本需求留空桩</text><rect x="90" y="720" width="580" height="280" rx="10" fill="#0F1B2D" stroke="#0F1B2D" stroke-width="1"/><text x="112" y="758" font-family="Microsoft YaHei" font-size="19" fill="#A8D5A2" font-weight="bold">--task psched 输出示例：</text><text x="112" y="798" font-family="Microsoft YaHei" font-size="20" fill="#E6F4EA" font-weight="normal">pid 4312 -> tasks [T1 T2]</text><text x="112" y="838" font-family="Microsoft YaHei" font-size="20" fill="#E6F4EA" font-weight="normal">  effectiveLevel [HIGH(300)]</text><text x="112" y="878" font-family="Microsoft YaHei" font-size="20" fill="#E6F4EA" font-weight="normal">pid 4401 -> tasks [T1]</text><text x="112" y="918" font-family="Microsoft YaHei" font-size="20" fill="#E6F4EA" font-weight="normal">  effectiveLevel [HIGH(300)]</text><text x="112" y="958" font-family="Microsoft YaHei" font-size="20" fill="#E6F4EA" font-weight="normal">Exemption summary: total=3</text><rect x="740" y="150" width="1120" height="880" rx="16" fill="#FFFFFF" stroke="#4472C4" stroke-width="2"/><rect x="770" y="180" width="8" height="38" rx="4" fill="#4472C4"/><text x="792" y="210" font-family="Microsoft YaHei" font-size="30" fill="#1A3A6B" font-weight="bold">验证矩阵（spec AC → VM 映射）</text><rect x="770" y="235" width="1060" height="56" rx="8" fill="#E8F0FE" stroke="#4472C4" stroke-width="1"/><text x="786" y="271" font-family="Microsoft YaHei" font-size="22" fill="#1A3A6B" font-weight="bold">AC</text><text x="900" y="271" font-family="Microsoft YaHei" font-size="22" fill="#1A3A6B" font-weight="bold">验证点</text><text x="1350" y="271" font-family="Microsoft YaHei" font-size="22" fill="#1A3A6B" font-weight="bold">VM</text><text x="1560" y="271" font-family="Microsoft YaHei" font-size="22" fill="#1A3A6B" font-weight="bold">方式 / 观测</text><rect x="770" y="300" width="1060" height="62" rx="6" fill="#FAFBFC" stroke="#80868B" stroke-width="1"/><text x="786" y="340" font-family="Microsoft YaHei" font-size="21" fill="#4472C4" font-weight="bold">AC-6.5</text><text x="900" y="340" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">创建判定并激活（startTask 无 priority 入参）</text><text x="1350" y="340" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">VM-1</text><text x="1560" y="340" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">单测 + 集成 demo</text><text x="1560" y="358" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">dump：任务档位</text><rect x="770" y="366" width="1060" height="62" rx="6" fill="#FFFFFF" stroke="#80868B" stroke-width="1"/><text x="786" y="406" font-family="Microsoft YaHei" font-size="21" fill="#4472C4" font-weight="bold">AC-6.6</text><text x="900" y="406" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">映射矩阵全组合（含边界档位 4/5）</text><text x="1350" y="406" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">VM-2</text><text x="1560" y="406" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">判定矩阵单测</text><text x="1560" y="424" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">dump：任务档位</text><rect x="770" y="432" width="1060" height="62" rx="6" fill="#FAFBFC" stroke="#80868B" stroke-width="1"/><text x="786" y="472" font-family="Microsoft YaHei" font-size="21" fill="#4472C4" font-weight="bold">AC-6.7</text><text x="900" y="472" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">动态重判（9 场景：前后台/档位跳变/防抖/共管）</text><text x="1350" y="472" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">VM-3</text><text x="1560" y="472" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">单测场景矩阵 + 集成</text><text x="1560" y="490" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">dump：任务与进程档位</text><rect x="770" y="498" width="1060" height="62" rx="6" fill="#FFFFFF" stroke="#80868B" stroke-width="1"/><text x="786" y="538" font-family="Microsoft YaHei" font-size="21" fill="#4472C4" font-weight="bold">AC-6.1</text><text x="900" y="538" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">多任务共管进程按最高档</text><text x="1350" y="538" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">VM-4</text><text x="1560" y="538" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">单测 + 集成</text><text x="1560" y="556" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">dump：effectiveLevel</text><rect x="770" y="564" width="1060" height="62" rx="6" fill="#FAFBFC" stroke="#80868B" stroke-width="1"/><text x="786" y="604" font-family="Microsoft YaHei" font-size="21" fill="#4472C4" font-weight="bold">AC-6.2</text><text x="900" y="604" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">最高档结束降次高 / 全部结束完全恢复</text><text x="1350" y="604" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">VM-5</text><text x="1560" y="604" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">单测 + 集成</text><text x="1560" y="622" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">dump：降级序列</text><rect x="770" y="630" width="1060" height="62" rx="6" fill="#FFFFFF" stroke="#80868B" stroke-width="1"/><text x="786" y="670" font-family="Microsoft YaHei" font-size="21" fill="#4472C4" font-weight="bold">AC-6.3</text><text x="900" y="670" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">死亡清理 ≤1s、任务存续</text><text x="1350" y="670" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">VM-6/VM-9</text><text x="1560" y="670" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">单测 + 集成</text><text x="1560" y="688" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">时延打点 + dump</text><rect x="770" y="696" width="1060" height="62" rx="6" fill="#FAFBFC" stroke="#80868B" stroke-width="1"/><text x="786" y="736" font-family="Microsoft YaHei" font-size="21" fill="#4472C4" font-weight="bold">AC-6.4</text><text x="900" y="736" font-family="Microsoft YaHei" font-size="20" fill="#202124" font-weight="normal">10 并发矩阵无竞态、无豁免泄漏</text><text x="1350" y="736" font-family="Microsoft YaHei" font-size="21" fill="#202124" font-weight="normal">VM-7</text><text x="1560" y="736" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">并发单测 + 集成</text><text x="1560" y="754" font-family="Microsoft YaHei" font-size="19" fill="#5F6368" font-weight="normal">hilog 事件序列</text><text x="770" y="778" font-family="Microsoft YaHei" font-size="20" fill="#5F6368" font-weight="normal">补充：R-7 兜底（感知失败→MEDIUM）由 VM-8 单测覆盖；多传 priority 入参按 401 处理由 VM-1 集成覆盖</text></svg>