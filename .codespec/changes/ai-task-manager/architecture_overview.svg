<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1440" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#667085"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#155eef"/></marker>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#155eef"/><stop offset="100%" stop-color="#4385f5"/></linearGradient>
  </defs>

  <!-- 白色不透明背景 -->
  <rect x="0" y="0" width="1600" height="1440" fill="#ffffff"/>

  <rect x="0" y="0" width="1600" height="92" fill="url(#hg)"/>
  <text x="800" y="42" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">AI 语音助手任务管理机制（AI Task Manager）</text>
  <text x="800" y="72" font-size="15" fill="#dbe7fe" text-anchor="middle">OpenHarmony 7.1 · ability_runtime · 任务级进程管控 · 参考 google-adk Invocation</text>

  <!-- ══ 背景 ══ -->
  <text x="60" y="134" font-size="25" font-weight="700" fill="#d92d20">▍背景：AI 语音助手当前痛点</text>
  <rect x="60" y="152" width="720" height="128" rx="14" fill="#fff5f4" stroke="#fda29b" stroke-width="2"/>
  <text x="420" y="184" font-size="19" font-weight="700" fill="#d92d20" text-anchor="middle">定时任务 · 锁屏下执行失败</text>
  <text x="420" y="216" font-size="15" fill="#667085" text-anchor="middle">闹钟联动、定时播报等任务在锁屏场景</text>
  <text x="420" y="240" font-size="15" fill="#667085" text-anchor="middle">进程被系统冻结，任务无法完成</text>
  <text x="420" y="266" font-size="12" fill="#98a2b3" text-anchor="middle">影响：核心语音场景不可用，用户感知明显</text>
  <rect x="820" y="152" width="720" height="128" rx="14" fill="#fff5f4" stroke="#fda29b" stroke-width="2"/>
  <text x="1180" y="184" font-size="19" font-weight="700" fill="#d92d20" text-anchor="middle">长时任务 · 切后台后被冻结</text>
  <text x="1180" y="216" font-size="15" fill="#667085" text-anchor="middle">批量处理、持续播报等任务切换后台后，</text>
  <text x="1180" y="240" font-size="15" fill="#667085" text-anchor="middle">进程被 RSS 管控冻结，执行中断</text>
  <text x="1180" y="266" font-size="12" fill="#98a2b3" text-anchor="middle">影响：长时任务无法完成，功能受限</text>
  <rect x="60" y="296" width="1480" height="48" rx="12" fill="#fffaeb" stroke="#fec84b" stroke-width="1.5"/>
  <text x="800" y="326" font-size="16" font-weight="600" fill="#b54708" text-anchor="middle">根因：缺乏任务级维度的可信资源管控手段 —— 安全管控问题暂不讨论，本期聚焦 RSS 管控（冻结）问题</text>

  <!-- ══ 方案 ══ -->
  <text x="60" y="390" font-size="25" font-weight="700" fill="#155eef">▍方案：任务管理机制架构</text>

  <!-- 调用方层 -->
  <rect x="60" y="410" width="1480" height="68" rx="14" fill="#f4f8ff" stroke="#a9c5f9" stroke-width="2"/>
  <text x="230" y="442" font-size="17" font-weight="700" fill="#155eef" text-anchor="middle">AI 语音助手</text>
  <text x="230" y="464" font-size="12.5" fill="#667085" text-anchor="middle">创建任务/设置状态/提交输入</text>
  <text x="800" y="442" font-size="17" font-weight="700" fill="#155eef" text-anchor="middle">系统 UI</text>
  <text x="800" y="464" font-size="12.5" fill="#667085" text-anchor="middle">监听任务状态/展示进度/用户交互</text>
  <text x="1370" y="442" font-size="17" font-weight="700" fill="#155eef" text-anchor="middle">启动链路</text>
  <text x="1370" y="464" font-size="12.5" fill="#667085" text-anchor="middle">StartAbility / ConnectAbility / 意图 / Cli / A2A</text>
  <path d="M 230 478 L 230 512" stroke="#667085" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 800 478 L 800 512" stroke="#667085" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 1370 478 L 1370 512" stroke="#667085" stroke-width="2" marker-end="url(#ar)"/>

  <!-- AMS 拦截点 -->
  <rect x="1080" y="512" width="460" height="92" rx="14" fill="#f4f8ff" stroke="#a9c5f9" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1310" y="540" font-size="17" font-weight="700" fill="#155eef" text-anchor="middle">AMS 拦截点（最小改动 · 12 场景全覆盖）</text>
  <text x="1310" y="566" font-size="13" fill="#667085" text-anchor="middle">解析 Want 携带的 ohos.ai.taskId → 条件两段式纳管</text>
  <text x="1310" y="590" font-size="12" fill="#98a2b3" text-anchor="middle">进程已存在→直接纳管 · 未创建→意向+attach 补注册（身份=①登记值）</text>

  <!-- AppMS 主框 -->
  <rect x="60" y="512" width="980" height="352" rx="16" fill="#fafbfc" stroke="#155eef" stroke-width="3"/>
  <text x="100" y="542" font-size="20" font-weight="700" fill="#155eef">AppMS（SA 501 · foundation 进程 · 收口）</text>

  <rect x="90" y="560" width="436" height="126" rx="12" fill="#f4f8ff" stroke="#a9c5f9" stroke-width="2"/>
  <text x="308" y="588" font-size="17" font-weight="700" fill="#155eef" text-anchor="middle">task_mgr（任务语义层）</text>
  <text x="308" y="614" font-size="13" fill="#667085" text-anchor="middle">任务模型 · 状态机（9 态）· 生命周期</text>
  <text x="308" y="638" font-size="13" fill="#667085" text-anchor="middle">状态查询/监听 · INPUT/AUTH 交互传达 · DFX</text>
  <text x="308" y="662" font-size="12" fill="#98a2b3" text-anchor="middle">ITaskManager（IDL）· 创建者鉴权 · 随机 taskId（B-1）</text>

  <rect x="548" y="560" width="462" height="126" rx="12" fill="#f4fdf7" stroke="#86e0bd" stroke-width="2"/>
  <text x="779" y="588" font-size="17" font-weight="700" fill="#067647" text-anchor="middle">process_schedule（通用能力层）</text>
  <text x="779" y="614" font-size="13" fill="#667085" text-anchor="middle">进程组双向索引 · 管控档位合并（max）</text>
  <text x="779" y="638" font-size="13" fill="#667085" text-anchor="middle">多任务归属（进程按最高档管控 · 需求 11）</text>
  <text x="779" y="662" font-size="12" fill="#98a2b3" text-anchor="middle">结束降级恢复 · 进程死亡清理 · 上限防滥用</text>

  <rect x="90" y="708" width="920" height="126" rx="12" fill="#faf7ff" stroke="#d0b3f7" stroke-width="2"/>
  <text x="550" y="736" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">ResourceControlProxy（资源管控代理层 · 代理模式）</text>
  <text x="550" y="762" font-size="13" fill="#667085" text-anchor="middle">语义接口：ControlRequest{taskId, pid, uid, tokenId, bundleName, type, priority, state, level, reason, timestamp}</text>
  <text x="550" y="786" font-size="13" fill="#667085" text-anchor="middle">一期 RCP-Stub：内存登记+日志审计 + 告警 + 生效校验 + 探测开关（master 上仅验上报链路，会假成功）｜对接后替换 RCP-Impl，上层零改动</text>
  <text x="550" y="810" font-size="12" fill="#98a2b3" text-anchor="middle">管控动作：EXEMPT 冻结豁免 / CLEAR_EXEMPT / THAW 解冻 / SET_QOS（二期）/ NotifyTaskEnd 任务级清理 / ResetAll 恢复</text>

  <path d="M 308 686 L 308 708" stroke="#667085" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 779 686 L 610 708" stroke="#667085" stroke-width="2" marker-end="url(#ar)"/>

  <!-- RSS 层 -->
  <rect x="60" y="880" width="980" height="72" rx="14" fill="#f4fdf7" stroke="#86e0bd" stroke-width="2"/>
  <text x="550" y="908" font-size="17" font-weight="700" fill="#067647" text-anchor="middle">resource_schedule_service（RSS · 团队主导 · 不改代码）</text>
  <text x="550" y="932" font-size="13" fill="#667085" text-anchor="middle">505 冻结豁免 / 517 解冻 / 506·507 查询（开源 master 无执行器 · 产品需 freezer + low_memory_frozen_enable）　·　二期：221 QoS · 520 查杀豁免</text>
  <path d="M 550 834 L 550 880" stroke="#667085" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 1080 558 L 1040 558" stroke="#155eef" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arB)"/>

  <!-- 关键机制条 -->
  <rect x="1080" y="640" width="460" height="212" rx="14" fill="#fafbfc" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="1310" y="668" font-size="18" font-weight="700" fill="#262626" text-anchor="middle">关键机制</text>
  <text x="1100" y="700" font-size="14" fill="#667085">· 状态机：9 态 + 流转校验（终态不可回退）</text>
  <text x="1100" y="728" font-size="14" fill="#667085">· 激活态：{SUBMITTED, WORKING, INPUT, AUTH}</text>
  <text x="1100" y="756" font-size="14" fill="#667085">· 优先级 4 档：LOW / MEDIUM / HIGH / CRITICAL</text>
  <text x="1100" y="784" font-size="14" fill="#667085">· 防仿冒 B-1+B-2：随机 taskId + caller 身份校验</text>
  <text x="1100" y="812" font-size="14" fill="#667085">· 交互传达：INPUT/AUTH payload 挂起 → 回传</text>
  <text x="1100" y="840" font-size="14" fill="#667085">· 对齐 google-adk：Invocation / HITL / 事件流</text>
  <rect x="1080" y="856" width="460" height="48" rx="12" fill="#fffaeb" stroke="#fec84b" stroke-width="1.5"/>
  <text x="1310" y="886" font-size="11.5" fill="#b54708" text-anchor="middle">开放项：枚举与 AI 助手对齐 · 锁屏豁免边界（搁置）· RSS 对接（master 无 freezer 执行器）</text>

  <!-- ══ 修改点 ══ -->
  <text x="60" y="1000" font-size="25" font-weight="700" fill="#067647">▍修改点（ability_ability_runtime）</text>

  <rect x="60" y="1018" width="780" height="360" rx="14" fill="#f4fdf7" stroke="#86e0bd" stroke-width="2"/>
  <text x="450" y="1048" font-size="18" font-weight="700" fill="#067647" text-anchor="middle">新增（约 35~40 个文件）</text>
  <text x="90" y="1080" font-size="14" fill="#667085">· services/appmgr/src/task_mgr/ —— 任务模型、状态机、监听、交互、DFX</text>
  <text x="90" y="1110" font-size="14" fill="#667085">· services/appmgr/src/process_schedule/ —— 进程组、档位合并、管控动作</text>
  <text x="90" y="1140" font-size="14" fill="#667085">· services/appmgr/src/resource_control_proxy/ —— 代理层（Stub 骨架 + Impl 占位）</text>
  <text x="90" y="1170" font-size="14" fill="#667085">· interfaces/inner_api/app_manager/task_manager/ —— ITaskManager.idl + TaskManagerClient</text>
  <text x="90" y="1200" font-size="14" fill="#667085">· hisysevent.yaml —— TASK_CREATE / TASK_STATE_CHANGE / TASK_DESTROY / TASK_INPUT /</text>
  <text x="90" y="1230" font-size="14" fill="#667085">   TASK_RSSCONTROL / TASK_ABUSE_WARNING 共 6 事件</text>
  <text x="90" y="1260" font-size="14" fill="#667085">· 错误码段（任务域 5 个）· test/unittest/（task_mgr 单测、拦截集成用例）</text>
  <text x="90" y="1290" font-size="14" fill="#667085">· 特性开关 ability_runtime_ai_task_manager_enable（默认 true）</text>

  <rect x="880" y="1018" width="660" height="360" rx="14" fill="#fffbf2" stroke="#fec84b" stroke-width="2"/>
  <text x="1210" y="1048" font-size="18" font-weight="700" fill="#b54708" text-anchor="middle">修改（最小化）</text>
  <text x="910" y="1080" font-size="14" fill="#667085">· services/abilitymgr —— StartAbilityInner / ConnectAbility 拦截点</text>
  <text x="930" y="1106" font-size="12.5" fill="#98a2b3">  解析 ohos.ai.taskId → 条件两段式纳管（失败不阻断启动）</text>
  <text x="910" y="1140" font-size="14" fill="#667085">· services/appmgr/BUILD.gn —— 新增源文件（ressched_client 依赖已有）</text>
  <text x="910" y="1170" font-size="14" fill="#667085">· services/appmgr 主类 OnStart —— 最小挂点（taskHandler 初始化）</text>
  <text x="910" y="1200" font-size="14" fill="#667085">· 进程死亡通知链 —— 复用既有 AppDeathRecipient（最小挂点）</text>
  <text x="910" y="1236" font-size="15" font-weight="700" fill="#b54708">约束（AGENTS.md）</text>
  <text x="910" y="1266" font-size="13" fill="#667085">· 不扩 IAppMgr 既有接口、不改 IPC 序列化 · AMS 经 inner_api 客户端调 AppMS</text>
  <text x="910" y="1294" font-size="13" fill="#667085">· RSS 仓不改代码（RSS 团队主导设计）</text>

  <!-- 规模条 -->
  <rect x="60" y="1396" width="1480" height="44" rx="12" fill="#f4f8ff" stroke="#a9c5f9" stroke-width="2"/>
  <text x="800" y="1424" font-size="15" font-weight="700" fill="#155eef" text-anchor="middle">代码量 ≈ 1.1 万行（生产 ~6,600 + 单测 ~4,300）· 单人约 4~6 周 · 任务分解 TASK-0~TASK-6 · RSS 真实对接与二期扩展（QoS/低内存查杀/NAPI）另计</text>
</svg>
