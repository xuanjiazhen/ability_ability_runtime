<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1360" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c8c8c"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1677ff"/>
    </marker>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f3a8a"/><stop offset="100%" stop-color="#1677ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="80" fill="url(#hg)"/>
  <text x="800" y="38" font-size="30" font-weight="bold" fill="#fff" text-anchor="middle">任务管理机制 · 三模块具体设计</text>
  <text x="800" y="66" font-size="16" fill="#d6e4ff" text-anchor="middle">task_mgr（任务语义层）→ process_schedule（通用进程调度层）→ resource_control_proxy（资源管控代理层）→ RSS</text>

  <!-- ═══ task_mgr ═══ -->
  <rect x="40" y="100" width="500" height="1050" rx="14" fill="#f0f7ff" stroke="#1677ff" stroke-width="3"/>
  <text x="290" y="132" font-size="22" font-weight="bold" fill="#1677ff" text-anchor="middle">task_mgr · 任务语义层</text>
  <text x="290" y="156" font-size="14" fill="#8c8c8c" text-anchor="middle">services/appmgr/src/task_mgr/（新增）</text>

  <!-- TaskManagerService -->
  <rect x="64" y="176" width="452" height="330" rx="10" fill="#fff" stroke="#69b1ff" stroke-width="2"/>
  <rect x="64" y="176" width="452" height="36" rx="10" fill="#e6f4ff"/>
  <text x="290" y="200" font-size="17" font-weight="bold" fill="#003eb3" text-anchor="middle">TaskManagerService（入口 · taskHandler 串行）</text>
  <text x="80" y="236" font-size="14" fill="#262626">职责：IPC 分发 · 系统应用鉴权 · 创建者校验（R-6）</text>
  <text x="80" y="260" font-size="14" fill="#262626">· 随机 taskId 生成（B-1 · 128bit 熵）· 上限管理（R-2）</text>
  <text x="80" y="284" font-size="14" fill="#595959">方法：</text>
  <text x="92" y="308" font-size="13" fill="#595959">CreateTask · DestroyTask · CancelTask · SetTaskState</text>
  <text x="92" y="330" font-size="13" fill="#595959">SetTaskParams · GetTaskInfo(s) · Register/UnregisterTaskListener</text>
  <text x="92" y="352" font-size="13" fill="#595959">SubmitTaskInput · RegisterTaskIntent · RegisterTaskProcess</text>
  <text x="92" y="374" font-size="13" fill="#595959">UnregisterTaskProcess</text>
  <text x="80" y="404" font-size="13" fill="#8c8c8c">事件联动：状态变更 → 监听回调 + process_schedule 重算</text>
  <text x="80" y="428" font-size="13" fill="#8c8c8c">终态 → 双通道清理（RestoreControl + NotifyTaskEnd）</text>
  <text x="80" y="452" font-size="13" fill="#8c8c8c">B-2 校验：callerTokenId ∈ {creator} ∪ {任务内进程 tokenId}</text>
  <text x="80" y="476" font-size="13" fill="#8c8c8c">意向表：RegisterTaskIntent 登记 · 30s 超时清理</text>

  <!-- TaskRecord -->
  <rect x="64" y="524" width="452" height="196" rx="10" fill="#fff" stroke="#69b1ff" stroke-width="1.5"/>
  <rect x="64" y="524" width="452" height="34" rx="10" fill="#e6f4ff"/>
  <text x="290" y="547" font-size="16" font-weight="bold" fill="#003eb3" text-anchor="middle">TaskRecord（任务记录 ≤1KB）</text>
  <text x="80" y="580" font-size="13" fill="#595959">taskId（随机 UUIDv4）· type · priority · state</text>
  <text x="80" y="602" font-size="13" fill="#595959">payload（交互描述/可选项）· input（回传内容）</text>
  <text x="80" y="624" font-size="13" fill="#595959">creatorTokenId · creatorUid · userId（多用户隔离）</text>
  <text x="80" y="646" font-size="13" fill="#595959">processPids（纳管进程集合）· createTime · updateTime</text>
  <text x="80" y="668" font-size="13" fill="#595959">exemptRefCount（豁免幂等引用计数）</text>
  <text x="80" y="696" font-size="12" fill="#8c8c8c">存储：内存态（AppMS 崩溃即失效，进程管控自动恢复）</text>

  <!-- TaskStateMachine -->
  <rect x="64" y="738" width="452" height="130" rx="10" fill="#fff" stroke="#69b1ff" stroke-width="1.5"/>
  <rect x="64" y="738" width="452" height="34" rx="10" fill="#e6f4ff"/>
  <text x="290" y="761" font-size="16" font-weight="bold" fill="#003eb3" text-anchor="middle">TaskStateMachine（状态机）</text>
  <text x="80" y="792" font-size="13" fill="#595959">CanTransition(from, to)：9 态合法流转表校验（design 4.2）</text>
  <text x="80" y="814" font-size="13" fill="#595959">终态不可回退（COMPLETED/CANCELED/FAILED/REJECTED）</text>
  <text x="80" y="836" font-size="13" fill="#595959">REJECTED 仅创建者可设 · 交互态必带 payload（R-16）</text>
  <text x="80" y="858" font-size="13" fill="#8c8c8c">校验失败 → ERR_TASK_INVALID_STATE_TRANSITION，状态不变</text>

  <!-- TaskListenerManager + TaskDfx -->
  <rect x="64" y="886" width="452" height="120" rx="10" fill="#fff" stroke="#69b1ff" stroke-width="1.5"/>
  <rect x="64" y="886" width="452" height="34" rx="10" fill="#e6f4ff"/>
  <text x="290" y="909" font-size="16" font-weight="bold" fill="#003eb3" text-anchor="middle">TaskListenerManager（监听）</text>
  <text x="80" y="940" font-size="13" fill="#595959">注册表（IRemoteObject 键）· 回调派发（顺序一致 R-14）</text>
  <text x="80" y="962" font-size="13" fill="#595959">DeathRecipient 自动清理 · 回调不阻塞状态机</text>
  <text x="80" y="986" font-size="13" fill="#8c8c8c">回调：OnTaskStateChanged(taskId, state, payload, timestamp)</text>

  <rect x="64" y="1022" width="452" height="106" rx="10" fill="#fff" stroke="#69b1ff" stroke-width="1.5"/>
  <rect x="64" y="1022" width="452" height="34" rx="10" fill="#e6f4ff"/>
  <text x="290" y="1045" font-size="16" font-weight="bold" fill="#003eb3" text-anchor="middle">TaskDfx（DFX）</text>
  <text x="80" y="1076" font-size="13" fill="#595959">hisysevent：TASK_CREATE / TASK_STATE_CHANGE / TASK_DESTROY</text>
  <text x="80" y="1098" font-size="13" fill="#595959">TASK_INPUT / TASK_RSSCONTROL / TASK_ABUSE_WARNING</text>
  <text x="80" y="1120" font-size="13" fill="#8c8c8c">dump：任务全景（状态/进程/档位/payload 摘要）· hilog</text>

  <!-- ═══ process_schedule ═══ -->
  <rect x="570" y="100" width="460" height="1050" rx="14" fill="#f0fbfa" stroke="#13c2c2" stroke-width="3"/>
  <text x="800" y="132" font-size="22" font-weight="bold" fill="#08979c" text-anchor="middle">process_schedule · 通用进程调度层</text>
  <text x="800" y="156" font-size="14" fill="#8c8c8c" text-anchor="middle">services/appmgr/src/process_schedule/（新增 · 与任务语义解耦）</text>

  <!-- ProcessScheduleManager -->
  <rect x="594" y="176" width="412" height="404" rx="10" fill="#fff" stroke="#5cdbd3" stroke-width="2"/>
  <rect x="594" y="176" width="412" height="36" rx="10" fill="#e6fffb"/>
  <text x="800" y="200" font-size="17" font-weight="bold" fill="#08979c" text-anchor="middle">ProcessScheduleManager（单例 · 串行）</text>
  <text x="610" y="236" font-size="14" fill="#262626">职责：进程组纳管 · 档位计算与合并</text>
  <text x="610" y="260" font-size="14" fill="#262626">· 管控动作施加/撤销（经 RCP）· 账本</text>
  <text x="610" y="284" font-size="14" fill="#595959">方法：</text>
  <text x="622" y="308" font-size="13" fill="#595959">AddProcessToTask(taskId, pid, priority)</text>
  <text x="622" y="330" font-size="13" fill="#595959">RemoveProcessFromTask(taskId, pid)</text>
  <text x="622" y="352" font-size="13" fill="#595959">OnProcessDied(pid)（死亡通知链驱动）</text>
  <text x="622" y="374" font-size="13" fill="#595959">OnTaskActiveChanged(taskId)（状态/优先级变化重算）</text>
  <text x="622" y="396" font-size="13" fill="#595959">GetEffectiveLevel(pid) → 档位合并（max）</text>
  <text x="622" y="418" font-size="13" fill="#595959">ApplyLevel(pid, level) → 增量施加/撤销</text>
  <text x="610" y="452" font-size="14" fill="#595959">数据成员：</text>
  <text x="622" y="476" font-size="13" fill="#595959">pidToTasks_ : map&lt;pid, set&lt;taskId&gt;&gt;（进程→任务）</text>
  <text x="622" y="498" font-size="13" fill="#595959">taskToPids_ : map&lt;taskId, set&lt;pid&gt;&gt;（任务→进程）</text>
  <text x="622" y="520" font-size="13" fill="#595959">effectiveLevel_ : map&lt;pid, Level&gt;（当前生效档位）</text>
  <text x="610" y="552" font-size="13" fill="#8c8c8c">档位变化 → 增量动作：升档施加 / 降档撤销</text>
  <text x="610" y="574" font-size="13" fill="#8c8c8c">同 pid 同类型豁免幂等（exemptRefCount）</text>

  <!-- ProcessSchedulePolicy -->
  <rect x="594" y="600" width="412" height="300" rx="10" fill="#fff" stroke="#5cdbd3" stroke-width="1.5"/>
  <rect x="594" y="600" width="412" height="34" rx="10" fill="#e6fffb"/>
  <text x="800" y="623" font-size="16" font-weight="bold" fill="#08979c" text-anchor="middle">ProcessSchedulePolicy（策略）</text>
  <text x="610" y="656" font-size="14" fill="#595959">优先级 → 档位映射：</text>
  <text x="622" y="682" font-size="13" fill="#595959">LOW=0 不豁免 · MEDIUM=1 限时豁免（30min 可配）</text>
  <text x="622" y="704" font-size="13" fill="#595959">HIGH=2 工作态全时豁免 · CRITICAL=3 豁免+提权</text>
  <text x="610" y="736" font-size="14" fill="#595959">上限/时长配置（可配）：</text>
  <text x="622" y="762" font-size="13" fill="#595959">创建者活跃任务 ≤16（R-2）</text>
  <text x="622" y="784" font-size="13" fill="#595959">任务进程集合 ≤64（防链式滥用，R-22）</text>
  <text x="622" y="806" font-size="13" fill="#595959">豁免时长上限 · 豁免进程总数上限</text>
  <text x="622" y="836" font-size="13" fill="#8c8c8c">配置加载：系统参数/配置文件（ability_runtime.gni 开关）</text>
  <text x="622" y="858" font-size="13" fill="#8c8c8c">超限 → 拒绝新增 + TASK_ABUSE_WARNING 告警</text>

  <!-- ProcessScheduleTypes -->
  <rect x="594" y="920" width="412" height="120" rx="10" fill="#fff" stroke="#5cdbd3" stroke-width="1.5"/>
  <rect x="594" y="920" width="412" height="34" rx="10" fill="#e6fffb"/>
  <text x="800" y="943" font-size="16" font-weight="bold" fill="#08979c" text-anchor="middle">ProcessScheduleTypes（类型）</text>
  <text x="610" y="974" font-size="13" fill="#595959">Level：0 不豁免 / 1 限时 / 2 全时 / 3 豁免+提权</text>
  <text x="610" y="996" font-size="13" fill="#595959">ControlActionRecord：{taskId, pid, action, level,</text>
  <text x="610" y="1018" font-size="13" fill="#595959">  timestamp, result}（账本，供撤销/审计/dump）</text>

  <!-- ═══ resource_control_proxy ═══ -->
  <rect x="1060" y="100" width="500" height="1050" rx="14" fill="#faf5ff" stroke="#722ed1" stroke-width="3"/>
  <text x="1310" y="132" font-size="22" font-weight="bold" fill="#531dab" text-anchor="middle">resource_control_proxy · 资源管控代理层</text>
  <text x="1310" y="156" font-size="14" fill="#8c8c8c" text-anchor="middle">services/appmgr/src/resource_control_proxy/（新增 · 代理模式）</text>

  <!-- RCP 接口 -->
  <rect x="1084" y="176" width="452" height="258" rx="10" fill="#fff" stroke="#b37feb" stroke-width="2"/>
  <rect x="1084" y="176" width="452" height="36" rx="10" fill="#f9f0ff"/>
  <text x="1310" y="200" font-size="17" font-weight="bold" fill="#531dab" text-anchor="middle">ResourceControlProxy（语义接口 · 与 RSS 细节解耦）</text>
  <text x="1100" y="236" font-size="13" fill="#595959">ApplyControl(ControlRequest) —— 施加管控（按 action/level）</text>
  <text x="1100" y="258" font-size="13" fill="#595959">RestoreControl(ControlRequest) —— 撤销管控（单进程）</text>
  <text x="1100" y="280" font-size="13" fill="#595959">NotifyTaskEnd(TaskEndInfo) —— 任务级清理通知（RSS 清理策略）</text>
  <text x="1100" y="302" font-size="13" fill="#595959">QueryControlState(pid, controlled) —— 查询（预留）</text>
  <text x="1100" y="324" font-size="13" fill="#595959">ResetAll(pid) —— 恢复该进程全部管控</text>
  <text x="1100" y="356" font-size="13" fill="#8c8c8c">ControlAction：EXEMPT / CLEAR_EXEMPT / THAW /</text>
  <text x="1100" y="378" font-size="13" fill="#8c8c8c">SET_QOS / CLEAR_QOS（后两者二期预留）</text>
  <text x="1100" y="408" font-size="13" fill="#8c8c8c">调用方：process_schedule（taskHandler 串行）</text>

  <!-- ControlRequest -->
  <rect x="1084" y="452" width="452" height="210" rx="10" fill="#fff" stroke="#b37feb" stroke-width="1.5"/>
  <rect x="1084" y="452" width="452" height="34" rx="10" fill="#f9f0ff"/>
  <text x="1310" y="475" font-size="16" font-weight="bold" fill="#531dab" text-anchor="middle">ControlRequest（完整上下文暴露）</text>
  <text x="1100" y="506" font-size="13" fill="#595959">taskId · pid · uid · tokenId · bundleName</text>
  <text x="1100" y="528" font-size="13" fill="#595959">taskType · priority · taskState · level</text>
  <text x="1100" y="550" font-size="13" fill="#595959">reason（激活/降级/结束/死亡）· timestamp</text>
  <text x="1100" y="580" font-size="13" fill="#8c8c8c">供 RSS 对接实现基于 bundle/type/priority 定制策略，</text>
  <text x="1100" y="602" font-size="13" fill="#8c8c8c">未来 qos/温控/低内存查杀等管控方直接复用结构</text>
  <text x="1100" y="634" font-size="13" fill="#8c8c8c">TaskEndInfo：{taskId, pids[], endReason, timestamp}</text>

  <!-- Stub / Impl -->
  <rect x="1084" y="680" width="452" height="240" rx="10" fill="#fff" stroke="#b37feb" stroke-width="1.5"/>
  <rect x="1084" y="680" width="452" height="34" rx="10" fill="#f9f0ff"/>
  <text x="1310" y="703" font-size="16" font-weight="bold" fill="#531dab" text-anchor="middle">实现（条件编译二选一）</text>
  <rect x="1100" y="722" width="420" height="88" rx="8" fill="#f6ffed" stroke="#95de64" stroke-width="1.5"/>
  <text x="1310" y="746" font-size="14" font-weight="bold" fill="#389e0d" text-anchor="middle">RCP-Stub（一期骨架）</text>
  <text x="1112" y="770" font-size="12" fill="#595959">动作账本（完整 ControlRequest 序列）+ TASK_RSSCONTROL</text>
  <text x="1112" y="792" font-size="12" fill="#595959">告警 + 探测开关（默认关）· 不产生真实 RSS 副作用</text>
  <rect x="1100" y="822" width="420" height="84" rx="8" fill="#fff1f0" stroke="#ff7875" stroke-width="1.5"/>
  <text x="1310" y="846" font-size="14" font-weight="bold" fill="#cf1322" text-anchor="middle">RCP-Impl（对接期 · RSS 明确后）</text>
  <text x="1112" y="870" font-size="12" fill="#595959">对接 RSS 提供能力（505/517 或新接口）· 账本为</text>
  <text x="1112" y="892" font-size="12" fill="#595959">验收基线（账本动作序列 == RSS 实际生效序列）</text>

  <!-- RSS 层 -->
  <rect x="40" y="1170" width="1520" height="120" rx="12" fill="#f6ffed" stroke="#95de64" stroke-width="2.5"/>
  <text x="800" y="1202" font-size="19" font-weight="bold" fill="#389e0d" text-anchor="middle">resource_schedule_service（RSS · 团队主导 · 不改代码）</text>
  <text x="800" y="1232" font-size="15" fill="#595959" text-anchor="middle">一期候选：RES_TYPE_DYNAMICALLY_SET_SUSPEND_EXEMPT(505) · SYNC_RES_TYPE_THAW_ONE_APP(517) · 状态查询 506/507</text>
  <text x="800" y="1258" font-size="15" fill="#595959" text-anchor="middle">二期扩展：RES_TYPE_PROCESS_QOS_CHANGE(221) · SYNC_RES_TYPE_SHOULD_FORCE_KILL_PROCESS(520) · QosManager（线程级 QoS/RTG）</text>
  <text x="800" y="1280" font-size="13" fill="#8c8c8c" text-anchor="middle">任务结束双通道：① 进程级 RestoreControl 撤销 ② NotifyTaskEnd 任务级清理（RSS 侧清理任务级策略/账本）</text>

  <!-- 层间箭头 -->
  <line x1="290" y1="400" x2="800" y2="340" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="520" y="355" font-size="13" fill="#8c8c8c">状态/生命周期事件</text>
  <line x1="800" y1="500" x2="1310" y2="400" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1010" y="445" font-size="13" fill="#8c8c8c">档位变化 → 管控动作</text>
  <line x1="1310" y1="936" x2="1310" y2="1170" stroke="#8c8c8c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1340" y="1060" font-size="13" fill="#8c8c8c">RSS 对接后真实调用</text>
</svg>
