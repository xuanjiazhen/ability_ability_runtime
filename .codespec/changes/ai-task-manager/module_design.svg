<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#667085"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#155eef"/></marker>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#155eef"/><stop offset="100%" stop-color="#4385f5"/></linearGradient>
  </defs>

  <!-- 白色不透明背景 -->
  <rect x="0" y="0" width="1600" height="1320" fill="#ffffff"/>

  <rect x="0" y="0" width="1600" height="92" fill="url(#hg)"/>
  <text x="800" y="42" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">任务管理机制 · 三模块具体设计</text>
  <text x="800" y="72" font-size="15" fill="#dbe7fe" text-anchor="middle">task_mgr（任务语义层）→ process_schedule（通用进程调度层）→ resource_control_proxy（资源管控代理层）→ RSS</text>

  <!-- ══ task_mgr ══ -->
  <rect x="40" y="112" width="500" height="1080" rx="18" fill="#f4f8ff" stroke="#a9c5f9" stroke-width="2.5"/>
  <rect x="40" y="112" width="500" height="64" rx="18" fill="#e1ecff"/>
  <text x="290" y="140" font-size="21" font-weight="700" fill="#155eef" text-anchor="middle">task_mgr · 任务语义层</text>
  <text x="290" y="163" font-size="13" fill="#667085" text-anchor="middle">services/appmgr/src/task_mgr/（新增 · 与进程调度解耦）</text>

  <rect x="64" y="192" width="452" height="332" rx="14" fill="#ffffff" stroke="#a9c5f9" stroke-width="2"/>
  <rect x="64" y="192" width="452" height="40" rx="14" fill="#e1ecff"/>
  <text x="290" y="218" font-size="17" font-weight="700" fill="#0b3d91" text-anchor="middle">TaskManagerService（入口 · taskHandler 串行）</text>
  <text x="80" y="256" font-size="14" fill="#262626">职责：IPC 分发 · 系统应用鉴权 · 创建者校验（R-6）</text>
  <text x="80" y="280" font-size="14" fill="#262626">· 随机 taskId（B-1 · 128bit）· 上限管理（R-2）</text>
  <text x="80" y="306" font-size="13" fill="#667085">方法：</text>
  <text x="92" y="330" font-size="12.5" fill="#667085">CreateTask · DestroyTask · CancelTask · SetTaskState</text>
  <text x="92" y="352" font-size="12.5" fill="#667085">SetTaskParams · GetTaskInfo(s) · Register/UnregisterTaskListener</text>
  <text x="92" y="374" font-size="12.5" fill="#667085">SubmitTaskInput · RegisterTaskIntent · RegisterTaskProcess</text>
  <text x="92" y="396" font-size="12.5" fill="#667085">UnregisterTaskProcess / UnregisterTaskIntent（attach 失败清理）</text>
  <text x="80" y="426" font-size="12.5" fill="#8c8c8c">事件联动：状态变更 → 监听回调 + process_schedule 重算</text>
  <text x="80" y="450" font-size="12.5" fill="#8c8c8c">终态 → 双通道清理（RestoreControl + NotifyTaskEnd）</text>
  <text x="80" y="474" font-size="12.5" fill="#8c8c8c">B-2 校验：callerTokenId ∈ {creator} ∪ {任务内进程}</text>
  <text x="80" y="498" font-size="12.5" fill="#8c8c8c">意向表：RegisterTaskIntent 登记 · 30s 超时清理</text>

  <rect x="64" y="540" width="452" height="196" rx="14" fill="#ffffff" stroke="#a9c5f9" stroke-width="1.5"/>
  <rect x="64" y="540" width="452" height="38" rx="14" fill="#e1ecff"/>
  <text x="290" y="565" font-size="16" font-weight="700" fill="#0b3d91" text-anchor="middle">TaskRecord（任务记录 ≤1KB · 内存态）</text>
  <text x="80" y="600" font-size="12.5" fill="#667085">taskId（随机 UUIDv4）· type · priority · state</text>
  <text x="80" y="622" font-size="12.5" fill="#667085">payload（交互描述/可选项）· input（回传内容）</text>
  <text x="80" y="644" font-size="12.5" fill="#667085">creatorTokenId · creatorUid · userId（多用户隔离）</text>
  <text x="80" y="666" font-size="12.5" fill="#667085">processPids（纳管进程集合）· createTime · updateTime</text>
  <text x="80" y="688" font-size="12.5" fill="#667085">exemptRefCount（豁免幂等引用计数）</text>
  <text x="80" y="716" font-size="12" fill="#98a2b3">AppMS 崩溃即失效，进程管控自动恢复原调度</text>

  <rect x="64" y="752" width="452" height="140" rx="14" fill="#ffffff" stroke="#a9c5f9" stroke-width="1.5"/>
  <rect x="64" y="752" width="452" height="38" rx="14" fill="#e1ecff"/>
  <text x="290" y="777" font-size="16" font-weight="700" fill="#0b3d91" text-anchor="middle">TaskStateMachine（状态机 · 9 态）</text>
  <text x="80" y="810" font-size="12.5" fill="#667085">CanTransition(from, to)：合法流转表校验（design 4.2）</text>
  <text x="80" y="832" font-size="12.5" fill="#667085">激活态 = {SUBMITTED, WORKING, INPUT_REQUIRED, AUTH_REQUIRED}</text>
  <text x="80" y="854" font-size="12.5" fill="#667085">终态不可回退 · REJECTED 仅创建者 · 交互态必带 payload</text>
  <text x="80" y="878" font-size="12.5" fill="#98a2b3">校验失败 → ERR_TASK_INVALID_STATE_TRANSITION，状态不变</text>

  <rect x="64" y="908" width="452" height="128" rx="14" fill="#ffffff" stroke="#a9c5f9" stroke-width="1.5"/>
  <rect x="64" y="908" width="452" height="38" rx="14" fill="#e1ecff"/>
  <text x="290" y="933" font-size="16" font-weight="700" fill="#0b3d91" text-anchor="middle">TaskListenerManager（监听）</text>
  <text x="80" y="966" font-size="12.5" fill="#667085">注册表（IRemoteObject 键）· 回调派发（顺序一致 R-14）</text>
  <text x="80" y="988" font-size="12.5" fill="#667085">DeathRecipient 自动清理 · 回调不阻塞状态机</text>
  <text x="80" y="1012" font-size="12.5" fill="#98a2b3">回调：OnTaskStateChanged(taskId, state, payload, timestamp)</text>

  <rect x="64" y="1052" width="452" height="120" rx="14" fill="#ffffff" stroke="#a9c5f9" stroke-width="1.5"/>
  <rect x="64" y="1052" width="452" height="38" rx="14" fill="#e1ecff"/>
  <text x="290" y="1077" font-size="16" font-weight="700" fill="#0b3d91" text-anchor="middle">TaskDfx（DFX）</text>
  <text x="80" y="1110" font-size="12.5" fill="#667085">hisysevent：TASK_CREATE / TASK_STATE_CHANGE / TASK_DESTROY</text>
  <text x="80" y="1132" font-size="12.5" fill="#667085">TASK_INPUT / TASK_RSSCONTROL / TASK_ABUSE_WARNING</text>
  <text x="80" y="1156" font-size="12.5" fill="#98a2b3">dump：任务全景（状态/进程/档位/payload 摘要）· hilog</text>

  <!-- ══ process_schedule ══ -->
  <rect x="570" y="112" width="460" height="1080" rx="18" fill="#f4fdf7" stroke="#86e0bd" stroke-width="2.5"/>
  <rect x="570" y="112" width="460" height="64" rx="18" fill="#dff5ea"/>
  <text x="800" y="140" font-size="21" font-weight="700" fill="#067647" text-anchor="middle">process_schedule · 通用进程调度层</text>
  <text x="800" y="163" font-size="13" fill="#667085" text-anchor="middle">services/appmgr/src/process_schedule/（新增 · 与任务语义解耦）</text>

  <rect x="594" y="192" width="412" height="408" rx="14" fill="#ffffff" stroke="#86e0bd" stroke-width="2"/>
  <rect x="594" y="192" width="412" height="40" rx="14" fill="#dff5ea"/>
  <text x="800" y="218" font-size="17" font-weight="700" fill="#067647" text-anchor="middle">ProcessScheduleManager（单例 · 串行）</text>
  <text x="610" y="256" font-size="14" fill="#262626">职责：进程组纳管 · 档位计算与合并</text>
  <text x="610" y="280" font-size="14" fill="#262626">· 管控动作施加/撤销（经 RCP）· 账本</text>
  <text x="610" y="306" font-size="13" fill="#667085">方法：</text>
  <text x="622" y="330" font-size="12.5" fill="#667085">AddProcessToTask(taskId, pid, priority)</text>
  <text x="622" y="352" font-size="12.5" fill="#667085">RemoveProcessFromTask(taskId, pid)</text>
  <text x="622" y="374" font-size="12.5" fill="#667085">OnProcessDied(pid)（死亡通知链驱动）</text>
  <text x="622" y="396" font-size="12.5" fill="#667085">OnTaskActiveChanged(taskId)（状态/优先级变化重算）</text>
  <text x="622" y="418" font-size="12.5" fill="#667085">GetEffectiveLevel(pid) → 档位合并（max）</text>
  <text x="622" y="440" font-size="12.5" fill="#667085">ApplyLevel(pid, level) → 增量施加/撤销</text>
  <text x="610" y="472" font-size="13" fill="#667085">数据成员：</text>
  <text x="622" y="496" font-size="12.5" fill="#667085">pidToTasks_ : map&lt;pid, set&lt;taskId&gt;&gt;（进程→任务）</text>
  <text x="622" y="518" font-size="12.5" fill="#667085">taskToPids_ : map&lt;taskId, set&lt;pid&gt;&gt;（任务→进程）</text>
  <text x="622" y="540" font-size="12.5" fill="#667085">effectiveLevel_ : map&lt;pid, Level&gt;（当前生效档位）</text>
  <text x="610" y="572" font-size="12.5" fill="#98a2b3">档位变化 → 增量动作：升档施加 / 降档撤销 · 同 pid 同类型</text>
  <text x="610" y="592" font-size="12.5" fill="#98a2b3">豁免幂等（exemptRefCount）· 进程级纳管（F-3）</text>

  <rect x="594" y="616" width="412" height="318" rx="14" fill="#ffffff" stroke="#86e0bd" stroke-width="1.5"/>
  <rect x="594" y="616" width="412" height="38" rx="14" fill="#dff5ea"/>
  <text x="800" y="641" font-size="16" font-weight="700" fill="#067647" text-anchor="middle">ProcessSchedulePolicy（策略）</text>
  <text x="610" y="676" font-size="13.5" fill="#595959">优先级 → 档位映射：</text>
  <text x="622" y="702" font-size="12.5" fill="#667085">LOW=0 不豁免 · MEDIUM=1 限时豁免（30min 可配）</text>
  <text x="622" y="724" font-size="12.5" fill="#667085">HIGH=2 激活态全时豁免 · CRITICAL=3 豁免+提权</text>
  <text x="622" y="748" font-size="12" font-weight="600" fill="#b54708">激活态 = {SUBMITTED, WORKING, INPUT, AUTH}（F-1）</text>
  <text x="610" y="780" font-size="13.5" fill="#595959">上限/时长配置（可配）：</text>
  <text x="622" y="806" font-size="12.5" fill="#667085">创建者活跃任务 ≤16（R-2）· 任务进程集合 ≤64（R-22）</text>
  <text x="622" y="828" font-size="12.5" fill="#667085">交互态超时 30min → 宽限 5min → 降档+告警 · 时长上限 60min（F-5）</text>
  <text x="622" y="858" font-size="12.5" fill="#98a2b3">配置加载：系统参数/配置文件（ability_runtime.gni 开关）</text>
  <text x="622" y="880" font-size="12.5" fill="#98a2b3">超限 → 拒绝新增 + TASK_ABUSE_WARNING 告警</text>
  <text x="622" y="908" font-size="12.5" fill="#98a2b3">SetTaskParams 提级 → OnTaskActiveChanged 重算（F-6）</text>

  <rect x="594" y="950" width="412" height="120" rx="14" fill="#ffffff" stroke="#86e0bd" stroke-width="1.5"/>
  <rect x="594" y="950" width="412" height="38" rx="14" fill="#dff5ea"/>
  <text x="800" y="975" font-size="16" font-weight="700" fill="#067647" text-anchor="middle">ProcessScheduleTypes（类型）</text>
  <text x="610" y="1008" font-size="12.5" fill="#667085">Level：0 不豁免 / 1 限时 / 2 全时 / 3 豁免+提权</text>
  <text x="610" y="1030" font-size="12.5" fill="#667085">ControlActionRecord：{taskId, pid, action, level,</text>
  <text x="610" y="1052" font-size="12.5" fill="#667085">  timestamp, result}（账本，供撤销/审计/dump）</text>

  <!-- ══ resource_control_proxy ══ -->
  <rect x="1060" y="112" width="500" height="1080" rx="18" fill="#faf7ff" stroke="#d0b3f7" stroke-width="2.5"/>
  <rect x="1060" y="112" width="500" height="64" rx="18" fill="#efe9ff"/>
  <text x="1310" y="140" font-size="21" font-weight="700" fill="#7c3aed" text-anchor="middle">resource_control_proxy · 资源管控代理层</text>
  <text x="1310" y="163" font-size="13" fill="#667085" text-anchor="middle">services/appmgr/src/resource_control_proxy/（新增 · 代理模式）</text>

  <rect x="1084" y="192" width="452" height="262" rx="14" fill="#ffffff" stroke="#d0b3f7" stroke-width="2"/>
  <rect x="1084" y="192" width="452" height="40" rx="14" fill="#efe9ff"/>
  <text x="1310" y="218" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">ResourceControlProxy（语义接口 · 与 RSS 细节解耦）</text>
  <text x="1100" y="256" font-size="12.5" fill="#667085">ApplyControl(ControlRequest) —— 施加管控（按 action/level）</text>
  <text x="1100" y="278" font-size="12.5" fill="#667085">RestoreControl(ControlRequest) —— 撤销管控（单进程）</text>
  <text x="1100" y="300" font-size="12.5" fill="#667085">NotifyTaskEnd(TaskEndInfo) —— 任务级清理通知（RSS 清理策略）</text>
  <text x="1100" y="322" font-size="12.5" fill="#667085">QueryControlState(pid, controlled) —— 生效校验/查询（F-4）</text>
  <text x="1100" y="344" font-size="12.5" fill="#667085">ResetAll(pid) —— 恢复该进程全部管控</text>
  <text x="1100" y="376" font-size="12.5" fill="#98a2b3">ControlAction：EXEMPT / CLEAR_EXEMPT / THAW /</text>
  <text x="1100" y="398" font-size="12.5" fill="#98a2b3">SET_QOS / CLEAR_QOS（后两者二期预留）</text>
  <text x="1100" y="428" font-size="12.5" fill="#98a2b3">调用方：process_schedule（taskHandler 串行）</text>

  <rect x="1084" y="470" width="452" height="196" rx="14" fill="#ffffff" stroke="#d0b3f7" stroke-width="1.5"/>
  <rect x="1084" y="470" width="452" height="38" rx="14" fill="#efe9ff"/>
  <text x="1310" y="495" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">ControlRequest（完整上下文暴露）</text>
  <text x="1100" y="528" font-size="12.5" fill="#667085">taskId · pid · uid · tokenId · bundleName</text>
  <text x="1100" y="550" font-size="12.5" fill="#667085">taskType · priority · taskState · level</text>
  <text x="1100" y="572" font-size="12.5" fill="#667085">reason（激活/降级/结束/死亡）· timestamp</text>
  <text x="1100" y="602" font-size="12.5" fill="#98a2b3">供 RSS 对接实现基于 bundle/type/priority 定制策略，</text>
  <text x="1100" y="624" font-size="12.5" fill="#98a2b3">未来 qos/温控/低内存查杀等管控方直接复用结构</text>
  <text x="1100" y="654" font-size="12.5" fill="#98a2b3">TaskEndInfo：{taskId, pids[], endReason, timestamp}</text>

  <rect x="1084" y="682" width="452" height="238" rx="14" fill="#ffffff" stroke="#d0b3f7" stroke-width="1.5"/>
  <rect x="1084" y="682" width="452" height="38" rx="14" fill="#efe9ff"/>
  <text x="1310" y="707" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">实现（条件编译二选一）</text>
  <rect x="1100" y="728" width="420" height="86" rx="10" fill="#f4fdf7" stroke="#86e0bd" stroke-width="1.5"/>
  <text x="1310" y="752" font-size="14" font-weight="700" fill="#067647" text-anchor="middle">RCP-Stub（一期骨架）</text>
  <text x="1112" y="776" font-size="12" fill="#667085">动作账本（完整 ControlRequest 序列）+ TASK_RSSCONTROL</text>
  <text x="1112" y="798" font-size="12" fill="#667085">告警 + 探测开关（默认关）· 不产生真实 RSS 副作用</text>
  <rect x="1100" y="824" width="420" height="82" rx="10" fill="#fff5f4" stroke="#fda29b" stroke-width="1.5"/>
  <text x="1310" y="848" font-size="14" font-weight="700" fill="#d92d20" text-anchor="middle">RCP-Impl（对接期 · RSS 明确后）</text>
  <text x="1112" y="872" font-size="12" fill="#667085">对接 RSS（505/517，经 suspend_manager_base_client）· 生效校验启用</text>
  <text x="1112" y="894" font-size="12" fill="#667085">账本为验收基线 · 同步调用不持锁+超时（P6）· RSS 重启重放（P4）</text>

  <!-- RSS 层 -->
  <rect x="40" y="1212" width="1520" height="92" rx="16" fill="#f4fdf7" stroke="#86e0bd" stroke-width="2.5"/>
  <text x="800" y="1244" font-size="18" font-weight="700" fill="#067647" text-anchor="middle">resource_schedule_service（RSS · 团队主导 · 不改代码）</text>
  <text x="800" y="1272" font-size="14" fill="#667085" text-anchor="middle">一期候选：505 冻结豁免 · 517 解冻 · 506/507 状态查询　｜　二期扩展：221 进程级 QoS · 520 低内存查杀豁免 · QosManager（线程级）</text>
  <text x="800" y="1296" font-size="12.5" fill="#98a2b3" text-anchor="middle">双通道清理：① RestoreControl 撤销　② NotifyTaskEnd 清理　｜　P1：开源 master 无 505/517/520 执行器（产品需 freezer+low_memory_frozen_enable）· RSS 重启按账本重放（P4）· push observer 漂移检测（P5 二期）</text>

  <!-- 层间箭头 -->
  <path d="M 290 410 C 430 360, 640 340, 780 380" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="520" y="350" font-size="13" fill="#667085">状态/生命周期事件</text>
  <path d="M 810 600 C 950 560, 1120 500, 1290 440" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="1030" y="510" font-size="13" fill="#667085">档位变化 → 管控动作</text>
  <path d="M 1310 920 L 1310 1212" stroke="#667085" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="1340" y="1060" font-size="13" fill="#667085">RSS 对接后真实调用</text>
</svg>
