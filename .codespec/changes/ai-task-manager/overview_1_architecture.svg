<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arB1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#155eef"/></marker>
    <marker id="arP1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <linearGradient id="hgA" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#155eef"/><stop offset="100%" stop-color="#4385f5"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="96" fill="url(#hgA)"/>
  <text x="960" y="42" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">AI 任务管理机制 · 方案介绍（1/4）</text>
  <text x="960" y="76" font-size="16" fill="#dbe7fe" text-anchor="middle">为 AI 语音助手提供的任务级资源保障：你的任务在锁屏、后台都能跑完</text>

  <!-- ══ 你遇到的问题 ══ -->
  <rect x="80" y="136" width="860" height="200" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="2.5"/>
  <text x="510" y="182" font-size="24" font-weight="700" fill="#b91c1c" text-anchor="middle">你的任务会被系统"冻住"</text>
  <text x="120" y="228" font-size="17" fill="#475467">· 定时任务（闹钟联动、定时播报）→ 锁屏后进程被冻结 → 到点无法执行</text>
  <text x="120" y="262" font-size="17" fill="#475467">· 长时任务（批量处理、持续播报）→ 切后台后进程被冻结 → 任务中断</text>
  <text x="120" y="300" font-size="15" fill="#98a2b3">系统资源管控（RSS）不知道"这批进程正在为用户做事"，一律按后台应用处理</text>

  <rect x="980" y="136" width="860" height="200" rx="16" fill="#eff4ff" stroke="#a9c5f9" stroke-width="2.5"/>
  <text x="1410" y="182" font-size="24" font-weight="700" fill="#0b3d91" text-anchor="middle">机制给你一个"任务"维度</text>
  <text x="1020" y="228" font-size="17" fill="#475467">· 把"我需要后台持续运行"变成系统可信的正式诉求</text>
  <text x="1020" y="262" font-size="17" fill="#475467">· 按任务优先级保障：高优任务进程不被冻结、按时唤醒执行</text>
  <text x="1020" y="300" font-size="15" fill="#98a2b3">不是绕过管控——有档位、有时长上限、有数量上限、全程可审计</text>

  <!-- ══ 三步使用模型 ══ -->
  <text x="960" y="396" font-size="24" font-weight="700" fill="#101828" text-anchor="middle">使用只需三步</text>

  <rect x="80" y="424" width="560" height="250" rx="18" fill="#eff4ff" stroke="#155eef" stroke-width="3"/>
  <circle cx="140" cy="484" r="28" fill="#155eef"/><text x="140" y="493" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="360" y="492" font-size="22" font-weight="700" fill="#0b3d91" text-anchor="middle">创建任务</text>
  <text x="110" y="544" font-size="15.5" fill="#344054">CreateTask(类型, 优先级, 描述)</text>
  <text x="110" y="576" font-size="15.5" fill="#344054">选优先级：</text>
  <text x="130" y="606" font-size="14.5" fill="#475467">· HIGH —— 锁屏定时/长时任务（推荐）</text>
  <text x="130" y="634" font-size="14.5" fill="#475467">· MEDIUM —— 可中断的普通后台任务</text>
  <text x="130" y="660" font-size="13" fill="#98a2b3">系统返回随机 taskId（无需保存到持久存储）</text>

  <rect x="680" y="424" width="560" height="250" rx="18" fill="#eff4ff" stroke="#155eef" stroke-width="3"/>
  <circle cx="740" cy="484" r="28" fill="#155eef"/><text x="740" y="493" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="960" y="492" font-size="22" font-weight="700" fill="#0b3d91" text-anchor="middle">带 taskId 启动能力</text>
  <text x="710" y="544" font-size="15.5" fill="#344054">Want 里加一个参数：ohos.ai.taskId</text>
  <text x="710" y="576" font-size="15.5" fill="#344054">· StartAbility / ConnectAbility</text>
  <text x="710" y="604" font-size="15.5" fill="#344054">· 意图框架 / CLI 工具 / A2A</text>
  <text x="710" y="636" font-size="14.5" fill="#067647">目标进程被自动纳入任务，获得同等的资源保障</text>
  <text x="710" y="660" font-size="13" fill="#98a2b3">进程内后续组件活动自动覆盖，无需逐个携带</text>

  <rect x="1280" y="424" width="560" height="250" rx="18" fill="#eff4ff" stroke="#155eef" stroke-width="3"/>
  <circle cx="1340" cy="484" r="28" fill="#155eef"/><text x="1340" y="493" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="1560" y="492" font-size="22" font-weight="700" fill="#0b3d91" text-anchor="middle">驱动状态 + 结束</text>
  <text x="1310" y="544" font-size="15.5" fill="#344054">SetTaskState 推进：提交 → 执行中 → 完成</text>
  <text x="1310" y="576" font-size="15.5" fill="#344054">等待用户输入/授权时：置交互态，随身 UI 展示</text>
  <text x="1310" y="608" font-size="15.5" fill="#344054">结束时：COMPLETED / FAILED / CANCELED</text>
  <text x="1310" y="640" font-size="14.5" fill="#067647">任务结束，系统自动撤销保障、恢复原调度</text>
  <text x="1310" y="664" font-size="13" fill="#98a2b3">忘记结束也没关系：超时机制自动兜底回收</text>

  <!-- ══ 系统侧发生了什么（黑盒视角）══ -->
  <rect x="80" y="716" width="1760" height="300" rx="18" fill="#f8f9fc" stroke="#d0d5dd" stroke-width="2"/>
  <text x="960" y="756" font-size="21" font-weight="700" fill="#101828" text-anchor="middle">系统内部帮你做了什么（无需关注细节）</text>

  <rect x="120" y="788" width="520" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="822" font-size="17" font-weight="700" fill="#344054" text-anchor="middle">自动识别并纳管任务进程</text>
  <text x="140" y="858" font-size="14" fill="#475467">启动链路上统一解析 taskId，无论经哪条</text>
  <text x="140" y="884" font-size="14" fill="#475467">链路启动的进程都自动进入任务</text>
  <text x="140" y="916" font-size="14" fill="#475467">进程退出自动移除；身份校验防伪造</text>
  <text x="140" y="950" font-size="12.5" fill="#98a2b3">→ 你只管带 taskId，别的都不用管</text>

  <rect x="700" y="788" width="520" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="960" y="822" font-size="17" font-weight="700" fill="#344054" text-anchor="middle">按优先级施加资源保障</text>
  <text x="720" y="858" font-size="14" fill="#475467">冻结豁免：任务执行期间进程不被冻结</text>
  <text x="720" y="884" font-size="14" fill="#475467">解冻唤醒：已冻结的进程被及时解冻</text>
  <text x="720" y="916" font-size="14" fill="#475467">待机联动：夜间深度待机也能联网执行</text>
  <text x="720" y="950" font-size="12.5" fill="#98a2b3">→ 锁屏/后台/夜间三类场景全覆盖</text>

  <rect x="1280" y="788" width="520" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1540" y="822" font-size="17" font-weight="700" fill="#344054" text-anchor="middle">自动降级与防滥用</text>
  <text x="1300" y="858" font-size="14" fill="#475467">任务结束/进程退出：立即恢复原调度，不留残留</text>
  <text x="1300" y="884" font-size="14" fill="#475467">多任务同进程：按最高优先级保障</text>
  <text x="1300" y="916" font-size="14" fill="#475467">上限保护：任务数/进程数/时长/续期次数</text>
  <text x="1300" y="950" font-size="12.5" fill="#98a2b3">→ 对系统资源影响可控，商用可审计</text>

  <text x="960" y="1054" font-size="13" fill="#98a2b3" text-anchor="middle">AI 任务管理机制 · 1/4 使用总览 · 后续：2/4 任务状态与优先级 · 3/4 场景保障效果 · 4/4 交互与接入</text>
</svg>
