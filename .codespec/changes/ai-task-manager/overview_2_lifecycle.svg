<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#155eef"/></marker>
    <linearGradient id="hgB" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#155eef"/><stop offset="100%" stop-color="#4385f5"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="96" fill="url(#hgB)"/>
  <text x="960" y="42" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">任务状态与优先级（2/4）</text>
  <text x="960" y="76" font-size="16" fill="#dbe7fe" text-anchor="middle">状态机由你驱动、系统校验；优先级决定保障强度——各档适合什么任务，一图看懂</text>

  <!-- ══ 状态机（紧凑版）══ -->
  <rect x="60" y="118" width="1800" height="400" rx="20" fill="#f8fafc" stroke="#d0d5dd" stroke-width="2"/>
  <text x="960" y="158" font-size="23" font-weight="700" fill="#101828" text-anchor="middle">任务状态：9 态生命周期（你设置，系统校验合法性）</text>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="140" y="196" width="190" height="56" rx="28" fill="#ffffff" stroke="#98a2b3" stroke-width="2.5"/><text x="235" y="230" fill="#475467">已创建</text>
    <rect x="420" y="196" width="190" height="56" rx="28" fill="#eff4ff" stroke="#155eef" stroke-width="2.5"/><text x="515" y="223" fill="#0b3d91">已提交</text>
    <rect x="700" y="196" width="190" height="56" rx="28" fill="#155eef"/><text x="795" y="230" fill="#ffffff">执行中</text>
    <rect x="980" y="120" width="210" height="56" rx="28" fill="#fdf2f8" stroke="#db2777" stroke-width="2.5"/><text x="1085" y="142" fill="#9d174d">等待用户输入</text>
    <rect x="980" y="272" width="210" height="56" rx="28" fill="#fdf2f8" stroke="#db2777" stroke-width="2.5"/><text x="1085" y="298" fill="#9d174d">等待用户授权</text>
  </g>
  <rect x="1380" y="110" width="440" height="270" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="1600" y="142" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="middle">终态（不可回退）</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="1410" y="164" width="180" height="48" rx="24" fill="#f0fdf4" stroke="#067647" stroke-width="2.5"/><text x="1500" y="194" fill="#067647">已完成</text>
    <rect x="1610" y="164" width="180" height="48" rx="24" fill="#fee2e2" stroke="#d92d20" stroke-width="2.5"/><text x="1700" y="194" fill="#b91c1c">已失败</text>
    <rect x="1410" y="232" width="180" height="48" rx="24" fill="#fee2e2" stroke="#d92d20" stroke-width="2.5"/><text x="1500" y="262" fill="#b91c1c">已取消</text>
    <rect x="1610" y="232" width="180" height="48" rx="24" fill="#fee2e2" stroke="#d92d20" stroke-width="2.5"/><text x="1700" y="262" fill="#b91c1c">已拒绝</text>
  </g>
  <text x="1600" y="316" font-size="12" fill="#98a2b3" text-anchor="middle">取消：任意非终态可发起 · 拒绝：仅创建者可设</text>

  <g stroke="#475467" stroke-width="2.5" fill="none">
    <path d="M 330 224 L 416 224" marker-end="url(#arB2)"/>
    <path d="M 610 224 L 696 224" marker-end="url(#arB2)"/>
    <path d="M 890 214 L 976 156" marker-end="url(#arB2)"/>
    <path d="M 890 240 L 976 296" marker-end="url(#arB2)"/>
    <path d="M 1085 176 L 795 214" stroke-dasharray="6 4" marker-end="url(#arB2)"/>
    <path d="M 1085 328 L 795 258" stroke-dasharray="6 4" marker-end="url(#arB2)"/>
    <path d="M 890 200 L 1406 188" stroke-dasharray="4 3" marker-end="url(#arB2)"/>
    <path d="M 1190 312 L 1606 220" stroke-dasharray="4 3" marker-end="url(#arB2)"/>
    <path d="M 235 252 L 235 356 L 1406 212" stroke-dasharray="4 3" marker-end="url(#arB2)"/>
  </g>
  <text x="373" y="208" font-size="12" fill="#667085" text-anchor="middle">提交</text>
  <text x="653" y="208" font-size="12" fill="#667085" text-anchor="middle">开始执行</text>
  <text x="950" y="140" font-size="12" fill="#667085" text-anchor="middle">需用户输入</text>
  <text x="950" y="316" font-size="12" fill="#667085" text-anchor="middle">需授权</text>
  <text x="940" y="168" font-size="11.5" fill="#667085" text-anchor="middle">用户已响应，回执行中</text>

  <text x="140" y="368" font-size="15.5" font-weight="700" fill="#101828">使用要点</text>
  <text x="160" y="398" font-size="14" fill="#475467">· 正常路径：创建 → 提交 → 执行中 → 已完成（四步）；等待用户时必须带"描述+可选项"</text>
  <text x="160" y="428" font-size="14" fill="#475467">· 执行中可随时更新进度描述；优先级可调（立即生效，调一次可续期一次保障时长）</text>
  <text x="160" y="458" font-size="14" fill="#475467">· 非法跳转/终态回退被系统拒绝并返回明确错误码，不会破坏任务</text>
  <text x="160" y="494" font-size="13" fill="#98a2b3">注：等待用户输入/授权也属"工作中"，保障持续；超 30 分钟未推进系统将通知你限期处理并自动回收保障</text>

  <!-- ══ 优先级：各档具体任务示例 ══ -->
  <rect x="60" y="544" width="1800" height="460" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="960" y="586" font-size="24" font-weight="700" fill="#067647" text-anchor="middle">优先级选型：各档适合的具体任务（建议初稿，待与你对齐）</text>

  <!-- LOW -->
  <rect x="100" y="624" width="420" height="240" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="100" y="624" width="420" height="48" rx="14" fill="#f1f5f9"/>
  <text x="310" y="654" font-size="18" font-weight="700" fill="#475467" text-anchor="middle">LOW · 低</text>
  <text x="118" y="686" font-size="12.5" fill="#667085">冻结了用户也感知不到，晚点做也行</text>
  <text x="118" y="714" font-size="13.5" fill="#475467">· 后台缓存清理 / 存储空间整理</text>
  <text x="118" y="742" font-size="13.5" fill="#475467">· 使用日志整理与延迟上传</text>
  <text x="118" y="770" font-size="13.5" fill="#475467">· 周期性数据统计报表</text>
  <text x="118" y="798" font-size="13.5" fill="#475467">· 个性化模型的后台训练（无时限）</text>
  <text x="118" y="826" font-size="13.5" fill="#475467">· 夜间内容预取（新闻/资讯缓存）</text>
  <text x="118" y="852" font-size="12" fill="#98a2b3">不保障：进程可被正常冻结</text>

  <!-- MEDIUM -->
  <rect x="560" y="624" width="420" height="240" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2.5"/>
  <rect x="560" y="624" width="420" height="48" rx="14" fill="#dcfce7"/>
  <text x="770" y="654" font-size="18" font-weight="700" fill="#067647" text-anchor="middle">MEDIUM · 中（限时保障 30 分钟）</text>
  <text x="578" y="686" font-size="12.5" fill="#667085">短时间能做完，中断了可续，但别拖</text>
  <text x="578" y="714" font-size="13.5" fill="#475467">· 批量文件格式转换 / 图片压缩</text>
  <text x="578" y="742" font-size="13.5" fill="#475467">· 联系人 / 日历增量同步</text>
  <text x="578" y="770" font-size="13.5" fill="#475467">· 播客 / 音乐离线缓存下载</text>
  <text x="578" y="798" font-size="13.5" fill="#475467">· 邮件后台预取</text>
  <text x="578" y="826" font-size="13.5" fill="#475467">· 天气 / 资讯数据刷新</text>
  <text x="578" y="852" font-size="12" fill="#98a2b3">到期未续自动恢复原调度</text>

  <!-- HIGH -->
  <rect x="1020" y="624" width="420" height="240" rx="14" fill="#155eef"/>
  <rect x="1020" y="624" width="420" height="48" rx="14" fill="#0b3d91"/>
  <text x="1230" y="654" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">HIGH · 高（持续保障 · 推荐）</text>
  <text x="1038" y="686" font-size="12.5" fill="#93b4f7">到点必须执行 / 做一半中断用户会察觉</text>
  <text x="1038" y="714" font-size="13.5" fill="#ffffff">· 闹钟联动（到点播报天气+日程）</text>
  <text x="1038" y="742" font-size="13.5" fill="#ffffff">· 定时提醒（"3 点提醒我开会"）</text>
  <text x="1038" y="770" font-size="13.5" fill="#ffffff">· 有声书 / 新闻长播报（30 分钟+）</text>
  <text x="1038" y="798" font-size="13.5" fill="#ffffff">· 整场会议录音转写</text>
  <text x="1038" y="826" font-size="13.5" fill="#ffffff">· 本地大模型长文摘要生成</text>
  <text x="1038" y="852" font-size="12" fill="#93b4f7">执行期间持续保障 · 可续期（最多 3 次）</text>

  <!-- CRITICAL -->
  <rect x="1480" y="624" width="380" height="240" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2.5"/>
  <rect x="1480" y="624" width="380" height="48" rx="14" fill="#f3e8ff"/>
  <text x="1670" y="654" font-size="18" font-weight="700" fill="#6b21a8" text-anchor="middle">CRITICAL · 最高</text>
  <text x="1498" y="686" font-size="12.5" fill="#98a2b3">用户此刻正盯着结果，卡顿即事故</text>
  <text x="1498" y="714" font-size="13.5" fill="#475467">· 实时语音转写 / 听写</text>
  <text x="1498" y="742" font-size="13.5" fill="#475467">· 即时翻译（对话中）</text>
  <text x="1498" y="770" font-size="13.5" fill="#475467">· 通话中的 AI 处理</text>
  <text x="1498" y="798" font-size="13.5" fill="#475467">· 车载 / 穿戴即时语音响应</text>
  <text x="1498" y="826" font-size="12" fill="#98a2b3">保障 + 调度优先级提升（二期）</text>

  <!-- 怎么选 -->
  <rect x="100" y="884" width="1720" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="960" y="916" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">怎么选：只问一个问题——"用户对这件事的连续性有多大期待？"</text>
  <text x="960" y="948" font-size="14" fill="#475467" text-anchor="middle">此刻正等着结果 → CRITICAL ｜ 到点必须执行 / 中断会被察觉 → HIGH ｜ 短时完成、可中断续做 → MEDIUM ｜ 什么时候做都行 → LOW</text>
  <text x="960" y="972" font-size="12.5" fill="#98a2b3" text-anchor="middle">同一件事在不同场景可取不同优先级：下载"马上要看的视频" → MEDIUM~HIGH；夜间自动缓存内容 → LOW。优先级反映的是用户期待，不是任务种类</text>

  <text x="960" y="1054" font-size="13" fill="#98a2b3" text-anchor="middle">AI 任务管理机制 · 2/4 任务状态与优先级 · 上限：单应用活跃任务 ≤16 · 单任务进程 ≤16 · 保障硬上限 60min（可配置）</text>
</svg>
