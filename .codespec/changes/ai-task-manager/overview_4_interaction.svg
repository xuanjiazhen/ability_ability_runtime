<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arB4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#155eef"/></marker>
    <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475467"/></marker>
    <linearGradient id="hg4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#db2777"/><stop offset="100%" stop-color="#155eef"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="1920" height="96" fill="url(#hg4)"/>
  <text x="960" y="44" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">交互承载与状态可观测（4/4）</text>
  <text x="960" y="76" font-size="15" fill="#fce7f3" text-anchor="middle">AI bar 内化交互（D-21）：进度呈现与 INPUT/AUTH 交互在助手进程内闭环 · 状态监听保留给安全管控/审计/系统监控等系统模块</text>

  <!-- ══ 左：AI bar 交互闭环（时序）══ -->
  <rect x="60" y="130" width="900" height="560" rx="18" fill="#fdf2f8" stroke="#db2777" stroke-width="2.5"/>
  <rect x="60" y="130" width="900" height="54" rx="18" fill="#fce7f3"/>
  <text x="510" y="164" font-size="20" font-weight="700" fill="#9d174d" text-anchor="middle">INPUT / AUTH 交互：AI bar 进程内闭环（D-21）</text>

  <!-- 泳道头 -->
  <rect x="100" y="200" width="180" height="44" rx="8" fill="#ffffff" stroke="#f9a8d4" stroke-width="2"/>
  <text x="190" y="228" font-size="14" font-weight="700" fill="#9d174d" text-anchor="middle">AI 助手</text>
  <rect x="360" y="200" width="180" height="44" rx="8" fill="#ffffff" stroke="#f9a8d4" stroke-width="2"/>
  <text x="450" y="228" font-size="14" font-weight="700" fill="#9d174d" text-anchor="middle">AI bar（自有 UI）</text>
  <rect x="620" y="200" width="140" height="44" rx="8" fill="#ffffff" stroke="#f9a8d4" stroke-width="2"/>
  <text x="690" y="228" font-size="14" font-weight="700" fill="#9d174d" text-anchor="middle">用户</text>
  <rect x="800" y="200" width="130" height="44" rx="8" fill="#ffffff" stroke="#f9a8d4" stroke-width="2"/>
  <text x="865" y="228" font-size="14" font-weight="700" fill="#9d174d" text-anchor="middle">task_mgr</text>

  <!-- 生命线 -->
  <line x1="190" y1="244" x2="190" y2="660" stroke="#f9a8d4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="450" y1="244" x2="450" y2="660" stroke="#f9a8d4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="690" y1="244" x2="690" y2="660" stroke="#f9a8d4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="865" y1="244" x2="865" y2="660" stroke="#f9a8d4" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- 消息 -->
  <path d="M 190 290 L 861 290" stroke="#155eef" stroke-width="2.5" marker-end="url(#arB4)"/>
  <text x="520" y="280" font-size="13" fill="#0b3d91" text-anchor="middle">① SetTaskState(INPUT_REQUIRED, payload{描述+可选项})</text>
  <text x="520" y="306" font-size="11" fill="#98a2b3" text-anchor="middle">payload 留存任务记录（事实记录，R-16）· 交互态属激活态（豁免维持）· 交互超时计时启动</text>

  <path d="M 190 360 L 446 360" stroke="#db2777" stroke-width="2.5" marker-end="url(#ar4)"/>
  <text x="318" y="350" font-size="13" fill="#9d174d" text-anchor="middle">② 呈现描述与可选项（进程内）</text>

  <path d="M 450 410 L 686 410" stroke="#db2777" stroke-width="2.5" marker-end="url(#ar4)"/>
  <text x="568" y="400" font-size="13" fill="#9d174d" text-anchor="middle">③ 展示</text>

  <path d="M 686 460 L 454 460" stroke="#db2777" stroke-width="2.5" marker-end="url(#ar4)"/>
  <text x="568" y="450" font-size="13" fill="#9d174d" text-anchor="middle">④ 选择 / 输入</text>

  <path d="M 446 510 L 194 510" stroke="#db2777" stroke-width="2.5" marker-end="url(#ar4)"/>
  <text x="318" y="500" font-size="13" fill="#9d174d" text-anchor="middle">⑤ 响应直达助手（无 IPC · 无模块中介）</text>

  <path d="M 190 570 L 861 570" stroke="#155eef" stroke-width="2.5" marker-end="url(#arB4)"/>
  <text x="520" y="560" font-size="13" fill="#0b3d91" text-anchor="middle">⑥ SetTaskState(WORKING / COMPLETED, payload 可选携带响应)</text>
  <text x="520" y="586" font-size="11" fill="#98a2b3" text-anchor="middle">流转出交互态 · 交互超时计时终止 · 状态机校验合法性</text>

  <rect x="100" y="610" width="830" height="60" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="515" y="634" font-size="12.5" fill="#92400e" text-anchor="middle">超时兜底（F-5 两段式）：30min 交互超时 → INTERACTIVE_TIMEOUT 通知限期处置（宽限 5min）→ 仍未流转 → 降档撤销豁免 + 告警</text>
  <text x="515" y="654" font-size="11" fill="#98a2b3" text-anchor="middle">任务滞留处置方案 A-9 待对齐（推荐窄口径系统流转：超时→FAILED / 创建者死亡→CANCELED）</text>

  <!-- ══ 右：监听与可观测 ══ -->
  <rect x="1020" y="130" width="840" height="560" rx="18" fill="#f8f9fc" stroke="#344054" stroke-width="2.5"/>
  <rect x="1020" y="130" width="840" height="54" rx="18" fill="#e9edf5"/>
  <text x="1440" y="164" font-size="20" font-weight="700" fill="#344054" text-anchor="middle">状态监听：供安全管控/审计/系统监控（D-21）</text>

  <rect x="1050" y="206" width="780" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1440" y="234" font-size="15" font-weight="700" fill="#344054" text-anchor="middle">监听通道（RegisterTaskListener · 系统应用）</text>
  <text x="1070" y="262" font-size="13" fill="#475467">· OnTaskStateChanged：任务状态变化（含进入交互态的 payload）</text>
  <text x="1070" y="288" font-size="13" fill="#475467">· OnTaskNotice（3 类超时通知）：INTERACTIVE_TIMEOUT / EXEMPT_EXPIRING / EXEMPT_EXPIRED</text>
  <text x="1070" y="314" font-size="12" fill="#98a2b3">· oneway 回调 · 顺序一致（R-14）· 监听者死亡自动移除 · 按 userId 过滤</text>

  <rect x="1050" y="366" width="380" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1240" y="394" font-size="15" font-weight="700" fill="#344054" text-anchor="middle">查询通道</text>
  <text x="1070" y="422" font-size="13" fill="#475467">· GetTaskInfos：任务列表（同 userId）</text>
  <text x="1070" y="448" font-size="13" fill="#475467">· GetTaskInfo：详情（状态/档位/进程/payload）</text>
  <text x="1070" y="474" font-size="13" fill="#475467">· 跨用户任务不可见（C-3）</text>
  <text x="1070" y="500" font-size="11.5" fill="#98a2b3">· 快照语义 · 权限管控（C-4）</text>

  <rect x="1460" y="366" width="370" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1645" y="394" font-size="15" font-weight="700" fill="#344054" text-anchor="middle">DFX（6 类 hisysevent + dump）</text>
  <text x="1480" y="422" font-size="13" fill="#475467">· TASK_CREATE / STATE_CHANGE / DESTROY</text>
  <text x="1480" y="448" font-size="13" fill="#475467">· TASK_INPUT / RSSCONTROL / ABUSE_WARNING</text>
  <text x="1480" y="474" font-size="13" fill="#475467">· hidumper -s 501：任务全景</text>
  <text x="1480" y="500" font-size="11.5" fill="#98a2b3">· 对账基线 = 动作日志序列（D-16）</text>

  <rect x="1050" y="536" width="780" height="130" rx="10" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/>
  <text x="1440" y="564" font-size="15" font-weight="700" fill="#9d174d" text-anchor="middle">D-21 变更说明（取代 D-11 传递通道）</text>
  <text x="1070" y="592" font-size="13" fill="#475467">· 进度展示：原"系统 UI 经通知实时收到"→ AI bar 自呈现（助手即数据源，无外部通知）</text>
  <text x="1070" y="618" font-size="13" fill="#475467">· 交互回传：原 SubmitTaskInput/INPUT_ARRIVED 通道 → 移除（AI bar 进程内闭环）</text>
  <text x="1070" y="644" font-size="13" fill="#475467">· 监听保留：消费方重定位为安全等系统模块（不参与控制，仅可观测）</text>

  <!-- ══ 底部：状态机全景 ══ -->
  <rect x="60" y="730" width="1800" height="290" rx="18" fill="#eff4ff" stroke="#155eef" stroke-width="2.5"/>
  <rect x="60" y="730" width="1800" height="54" rx="18" fill="#e1ecff"/>
  <text x="960" y="764" font-size="20" font-weight="700" fill="#0b3d91" text-anchor="middle">任务状态机（9 态 · 创建者驱动 + 模块校验 · ADR-6）</text>

  <!-- 节点 -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="120" y="810" width="170" height="56" rx="28" fill="#ffffff" stroke="#98a2b3" stroke-width="2.5"/><text x="205" y="844" fill="#475467">UNKNOWN</text>
    <rect x="370" y="810" width="170" height="56" rx="28" fill="#eff4ff" stroke="#155eef" stroke-width="2.5"/><text x="455" y="844" fill="#0b3d91">SUBMITTED</text>
    <rect x="620" y="810" width="170" height="56" rx="28" fill="#155eef"/><text x="705" y="844" fill="#ffffff">WORKING</text>
    <rect x="880" y="810" width="200" height="56" rx="28" fill="#fdf2f8" stroke="#db2777" stroke-width="2.5"/><text x="980" y="836" fill="#9d174d">INPUT_REQUIRED</text>
    <rect x="880" y="900" width="200" height="56" rx="28" fill="#fdf2f8" stroke="#db2777" stroke-width="2.5"/><text x="980" y="926" fill="#9d174d">AUTH_REQUIRED</text>
    <rect x="1160" y="810" width="180" height="56" rx="28" fill="#f0fdf4" stroke="#067647" stroke-width="2.5"/><text x="1250" y="844" fill="#067647">COMPLETED</text>
    <rect x="1390" y="810" width="150" height="56" rx="10" fill="#fee2e2" stroke="#d92d20" stroke-width="2.5"/><text x="1465" y="844" fill="#b91c1c">FAILED</text>
    <rect x="1160" y="900" width="180" height="56" rx="10" fill="#fee2e2" stroke="#d92d20" stroke-width="2.5"/><text x="1250" y="934" fill="#b91c1c">CANCELED</text>
    <rect x="1390" y="900" width="150" height="56" rx="10" fill="#fee2e2" stroke="#d92d20" stroke-width="2.5"/><text x="1465" y="934" fill="#b91c1c">REJECTED</text>
  </g>
  <text x="1050" y="1000" font-size="12.5" fill="#98a2b3" text-anchor="middle">激活态（豁免生效）：SUBMITTED / WORKING / INPUT_REQUIRED / AUTH_REQUIRED（F-1）· 终态不可回退（R-4）· REJECTED 仅创建者可设 · INPUT/AUTH 必带 payload</text>

  <!-- 流转线 -->
  <g stroke="#667085" stroke-width="2.2" fill="none">
    <path d="M 290 838 L 366 838" marker-end="url(#ar4)"/>
    <path d="M 540 838 L 616 838" marker-end="url(#ar4)"/>
    <path d="M 790 830 L 876 830" marker-end="url(#ar4)"/>
    <path d="M 980 866 L 980 896" marker-end="url(#ar4)"/>
    <path d="M 1080 838 L 1156 838" marker-end="url(#ar4)"/>
    <path d="M 1080 928 L 1156 928" marker-end="url(#ar4)"/>
    <path d="M 880 880 L 715 868" marker-end="url(#ar4)" stroke-dasharray="5 4"/>
    <path d="M 880 920 L 715 900" stroke-dasharray="5 4" marker-end="url(#ar4)"/>
    <path d="M 205 866 L 205 928 L 1386 948" stroke-dasharray="4 3" marker-end="url(#ar4)"/>
    <path d="M 290 820 L 1386 830" stroke-dasharray="4 3" marker-end="url(#ar4)"/>
  </g>
  <text x="330" y="822" font-size="11" fill="#667085" text-anchor="middle">提交</text>
  <text x="578" y="822" font-size="11" fill="#667085" text-anchor="middle">开始执行</text>
  <text x="833" y="816" font-size="11" fill="#667085" text-anchor="middle">等待输入</text>
  <text x="1118" y="822" font-size="11" fill="#667085" text-anchor="middle">完成/失败</text>
  <text x="798" y="880" font-size="11" fill="#667085" text-anchor="end">AI bar 交互完成 → 回 WORKING（D-21）</text>

  <text x="960" y="1058" font-size="12" fill="#98a2b3" text-anchor="middle">AI Task Manager · 交互与可观测 4/4 · 依据 design.md §4（状态机）/§5.5（D-21 重写）/§7（DFX）</text>
</svg>
