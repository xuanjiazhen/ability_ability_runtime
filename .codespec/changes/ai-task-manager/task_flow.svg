<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1520" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#667085"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1677ff"/></marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fa8c16"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#12b76a"/></marker>
    <marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/></marker>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#155eef"/><stop offset="100%" stop-color="#4385f5"/></linearGradient>
  </defs>

  <!-- 白色不透明背景 -->
  <rect x="0" y="0" width="1600" height="1520" fill="#ffffff"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="1600" height="92" fill="url(#hg)"/>
  <text x="800" y="42" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">任务管理机制 · 整体流程图</text>
  <text x="800" y="72" font-size="15" fill="#dbe7fe" text-anchor="middle">任务创建 → 启动纳管（条件两段式）→ RSS 管控（生效校验）→ 交互传达 → 结束清理（双通道）　|　泳道时序</text>

  <!-- 泳道背景 -->
  <rect x="40" y="112" width="380" height="1370" rx="16" fill="#f4f8ff"/>
  <rect x="428" y="112" width="356" height="1370" rx="16" fill="#fffbf2"/>
  <rect x="792" y="112" width="424" height="1370" rx="16" fill="#f4fdf7"/>
  <rect x="1224" y="112" width="336" height="1370" rx="16" fill="#faf7ff"/>
  <!-- 泳道标题条 -->
  <rect x="40" y="112" width="380" height="56" rx="16" fill="#e1ecff"/>
  <rect x="428" y="112" width="356" height="56" rx="16" fill="#fff3d6"/>
  <rect x="792" y="112" width="424" height="56" rx="16" fill="#dff5ea"/>
  <rect x="1224" y="112" width="336" height="56" rx="16" fill="#efe9ff"/>
  <text x="230" y="147" font-size="19" font-weight="700" fill="#155eef" text-anchor="middle">AI 语音助手</text>
  <text x="606" y="147" font-size="19" font-weight="700" fill="#b54708" text-anchor="middle">AMS（拦截点）</text>
  <text x="1004" y="147" font-size="19" font-weight="700" fill="#067647" text-anchor="middle">AppMS（task_mgr / process_schedule / RCP）</text>
  <text x="1392" y="147" font-size="19" font-weight="700" fill="#7c3aed" text-anchor="middle">RSS</text>

  <!-- ══ ① 创建任务 ══ -->
  <circle cx="84" cy="216" r="16" fill="#155eef"/><text x="84" y="222" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <rect x="112" y="192" width="284" height="116" rx="14" fill="#ffffff" stroke="#a9c5f9" stroke-width="2"/>
  <text x="254" y="220" font-size="15" font-weight="700" fill="#0b3d91" text-anchor="middle">CreateTask(type, priority, payload)</text>
  <text x="254" y="246" font-size="12" fill="#667085" text-anchor="middle">系统应用鉴权 · 随机 taskId（B-1 · 128bit）</text>
  <text x="254" y="268" font-size="12" fill="#667085" text-anchor="middle">创建 TaskRecord · 状态 = UNKNOWN（非激活）</text>
  <text x="254" y="292" font-size="12" fill="#98a2b3" text-anchor="middle">任务数上限校验（≤16，R-2）</text>
  <path d="M 254 308 L 254 356" stroke="#667085" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="112" y="356" width="284" height="56" rx="12" fill="#e1ecff" stroke="#a9c5f9" stroke-width="1.5"/>
  <text x="254" y="380" font-size="13" font-weight="600" fill="#155eef" text-anchor="middle">返回 taskId · TASK_CREATE 事件</text>
  <text x="254" y="400" font-size="11" fill="#667085" text-anchor="middle">创建者绑定（tokenId/uid/userId）</text>

  <!-- ══ ② 提交并激活 ══ -->
  <circle cx="84" cy="470" r="16" fill="#155eef"/><text x="84" y="476" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <rect x="112" y="446" width="284" height="118" rx="14" fill="#ffffff" stroke="#a9c5f9" stroke-width="2"/>
  <text x="254" y="474" font-size="15" font-weight="700" fill="#0b3d91" text-anchor="middle">SetTaskState(SUBMITTED→WORKING)</text>
  <text x="254" y="500" font-size="12" fill="#667085" text-anchor="middle">状态机校验流转合法 · 监听者收到回调</text>
  <text x="254" y="522" font-size="12" fill="#667085" text-anchor="middle">UNKNOWN→SUBMITTED→WORKING</text>
  <text x="254" y="546" font-size="11" font-weight="600" fill="#b54708" text-anchor="middle">激活态含 SUBMITTED（F-1：就绪即保障可调度）</text>
  <path d="M 254 564 L 254 612" stroke="#667085" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="112" y="612" width="284" height="76" rx="12" fill="#dff5ea" stroke="#86e0bd" stroke-width="1.5"/>
  <text x="254" y="636" font-size="13" font-weight="700" fill="#067647" text-anchor="middle">task_mgr → process_schedule</text>
  <text x="254" y="658" font-size="12" fill="#667085" text-anchor="middle">OnTaskActiveChanged：HIGH → 档位 2（激活）</text>
  <text x="254" y="678" font-size="11" fill="#667085" text-anchor="middle">任务级档位先记 · 待进程纳管后生效</text>

  <!-- ══ ③ 启动携带 taskId ══ -->
  <circle cx="84" cy="748" r="16" fill="#f79009"/><text x="84" y="754" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <rect x="112" y="724" width="284" height="106" rx="14" fill="#ffffff" stroke="#fec84b" stroke-width="2"/>
  <text x="254" y="752" font-size="15" font-weight="700" fill="#b54708" text-anchor="middle">StartAbility(want[ohos.ai.taskId])</text>
  <text x="254" y="778" font-size="12" fill="#667085" text-anchor="middle">StartAbilityInner 拦截点 · 解析 taskId</text>
  <text x="254" y="800" font-size="12" fill="#667085" text-anchor="middle">业务发起方身份（AsCaller/SpecifyTokenId 优先）</text>
  <text x="254" y="822" font-size="11" fill="#98a2b3" text-anchor="middle">无 taskId → 短路零开销（R-13）</text>
  <path d="M 396 776 L 438 776" stroke="#f79009" stroke-width="2.5" marker-end="url(#arO)"/>

  <!-- ══ ④ 条件两段式 ══ -->
  <circle cx="464" cy="776" r="16" fill="#f79009"/><text x="464" y="782" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <rect x="490" y="730" width="268" height="150" rx="14" fill="#ffffff" stroke="#fec84b" stroke-width="2"/>
  <text x="624" y="758" font-size="15" font-weight="700" fill="#b54708" text-anchor="middle">条件两段式判定（目标 pid）</text>
  <text x="624" y="784" font-size="12" fill="#667085" text-anchor="middle">进程已存在（record-&gt;GetPid() &gt; 0）</text>
  <text x="624" y="804" font-size="12" fill="#667085" text-anchor="middle">→ RegisterTaskProcess 直接纳管</text>
  <text x="624" y="830" font-size="12" fill="#667085" text-anchor="middle">进程未创建 → RegisterTaskIntent 意向</text>
  <text x="624" y="850" font-size="12" fill="#667085" text-anchor="middle">attach 后补注册（身份取①登记发起方）</text>
  <text x="624" y="872" font-size="11" fill="#98a2b3" text-anchor="middle">attach 失败 → UnregisterTaskIntent 清理（F-7）</text>
  <path d="M 758 805 L 800 805" stroke="#f79009" stroke-width="2.5" marker-end="url(#arO)"/>

  <!-- ══ ⑤ B-2 校验 + 纳管 + 档位合并 ══ -->
  <circle cx="828" cy="805" r="16" fill="#f79009"/><text x="828" y="811" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <rect x="856" y="762" width="332" height="132" rx="14" fill="#ffffff" stroke="#86e0bd" stroke-width="2"/>
  <text x="1022" y="790" font-size="15" font-weight="700" fill="#067647" text-anchor="middle">task_mgr：B-2 caller 校验</text>
  <text x="1022" y="814" font-size="12" fill="#667085" text-anchor="middle">callerTokenId ∈ {creator} ∪ {任务内进程 tokenId}</text>
  <text x="1022" y="836" font-size="12" fill="#667085" text-anchor="middle">仿冒 → 拒绝纳管，不阻断启动（防探测）</text>
  <text x="1022" y="858" font-size="12" fill="#667085" text-anchor="middle">通过 → pid 加入 processPids（进程级纳管）</text>
  <text x="1022" y="878" font-size="11" fill="#98a2b3" text-anchor="middle">进程内组件活动共享档位 · 死亡通知链自动移除</text>
  <path d="M 1022 894 L 1022 940" stroke="#667085" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="856" y="940" width="332" height="80" rx="12" fill="#dff5ea" stroke="#86e0bd" stroke-width="1.5"/>
  <text x="1022" y="964" font-size="13" font-weight="700" fill="#067647" text-anchor="middle">process_schedule：AddProcessToTask</text>
  <text x="1022" y="988" font-size="12" fill="#667085" text-anchor="middle">档位合并：effective(pid) = max(任务档位)</text>
  <text x="1022" y="1010" font-size="11" fill="#667085" text-anchor="middle">多任务纳管按最高档 · 升档增量施加 → 档位 2 生效</text>

  <!-- ══ ⑥ RCP 管控 + 生效校验 ══ -->
  <path d="M 1022 1020 L 1022 1064" stroke="#667085" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="1022" cy="1064" r="16" fill="#7c3aed"/><text x="1022" y="1070" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <rect x="856" y="1092" width="332" height="128" rx="14" fill="#ffffff" stroke="#d0b3f7" stroke-width="2"/>
  <text x="1022" y="1120" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">RCP：ApplyControl(EXEMPT, 档位 2)</text>
  <text x="1022" y="1144" font-size="12" fill="#667085" text-anchor="middle">ControlRequest 完整上下文 · 账本记录</text>
  <text x="1022" y="1166" font-size="12" font-weight="600" fill="#b54708" text-anchor="middle">生效校验（F-4）：507 查询 · 已冻结→THAW(517)</text>
  <text x="1022" y="1188" font-size="11" fill="#98a2b3" text-anchor="middle">一期 Stub：记账 + TASK_RSSCONTROL + 告警</text>
  <text x="1022" y="1206" font-size="11" fill="#98a2b3" text-anchor="middle">对接期 Impl：真实下发（RSS 对接后）</text>
  <path d="M 1188 1156 L 1232 1156" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arP)"/>
  <rect x="1232" y="1112" width="304" height="92" rx="14" fill="#ffffff" stroke="#d0b3f7" stroke-width="1.5"/>
  <text x="1384" y="1140" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">冻结豁免生效（对接后）</text>
  <text x="1384" y="1164" font-size="12" fill="#667085" text-anchor="middle">505 豁免 · 517 解冻 · 506/507 查询</text>
  <text x="1384" y="1186" font-size="11" fill="#98a2b3" text-anchor="middle">产品需 freezer 执行器+开关（master 无执行器）</text>

  <!-- ══ ⑦ INPUT/AUTH 交互分支 ══ -->
  <circle cx="84" cy="1300" r="16" fill="#155eef"/><text x="84" y="1306" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">7</text>
  <rect x="112" y="1276" width="284" height="126" rx="14" fill="#ffffff" stroke="#a9c5f9" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="254" y="1304" font-size="14" font-weight="700" fill="#0b3d91" text-anchor="middle">INPUT/AUTH 交互（可选分支）</text>
  <text x="254" y="1328" font-size="12" fill="#667085" text-anchor="middle">SetTaskState(INPUT_REQUIRED, payload)</text>
  <text x="254" y="1350" font-size="12" fill="#667085" text-anchor="middle">→ 监听回调（系统 UI 展示描述/可选项）</text>
  <text x="254" y="1370" font-size="12" fill="#667085" text-anchor="middle">→ SubmitTaskInput 回传 → 回 WORKING</text>
  <text x="254" y="1392" font-size="11" fill="#98a2b3" text-anchor="middle">超时 30min → 宽限 5min → 降档+告警（F-5 两段式）</text>
  <path d="M 396 1338 L 438 1338" stroke="#667085" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <rect x="438" y="1300" width="284" height="72" rx="12" fill="#fffaeb" stroke="#fec84b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="580" y="1328" font-size="12" fill="#b54708" text-anchor="middle">task_mgr 校验创建者后回传 input</text>
  <text x="580" y="1350" font-size="12" fill="#667085" text-anchor="middle">对齐 google-adk HITL（request_credential）</text>

  <!-- ══ ⑧ 结束双通道清理 ══ -->
  <circle cx="1022" cy="1300" r="16" fill="#d92d20"/><text x="1022" y="1306" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">8</text>
  <rect x="856" y="1276" width="332" height="126" rx="14" fill="#ffffff" stroke="#fda29b" stroke-width="2"/>
  <text x="1022" y="1304" font-size="15" font-weight="700" fill="#d92d20" text-anchor="middle">任务终态 / DestroyTask（双通道清理）</text>
  <text x="1022" y="1328" font-size="12" fill="#667085" text-anchor="middle">① 每进程 RestoreControl → 档位重算（剩余最高档）</text>
  <text x="1022" y="1350" font-size="12" fill="#667085" text-anchor="middle">② NotifyTaskEnd(taskId, pids, reason) → RSS 清理策略</text>
  <text x="1022" y="1374" font-size="11" fill="#98a2b3" text-anchor="middle">失败重试 ≤3 · 账本保留 · TASK_DESTROY 事件</text>
  <text x="1022" y="1394" font-size="11" fill="#98a2b3" text-anchor="middle">进程未退出 → 恢复原调度（需求 12）· RSS 重启按账本重放豁免</text>
  <path d="M 1188 1338 L 1232 1338" stroke="#d92d20" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="1232" y="1300" width="304" height="92" rx="14" fill="#fff5f4" stroke="#fda29b" stroke-width="1.5"/>
  <text x="1384" y="1328" font-size="14" font-weight="700" fill="#d92d20" text-anchor="middle">清理任务级策略/账本（对接后）</text>
  <text x="1384" y="1352" font-size="12" fill="#667085" text-anchor="middle">豁免组/优先级组残留清理</text>
  <text x="1384" y="1374" font-size="11" fill="#98a2b3" text-anchor="middle">按 taskId 建立的 RSS 策略回收</text>

  <!-- 状态机侧注（左下） -->
  <rect x="112" y="1040" width="284" height="216" rx="14" fill="#ffffff" stroke="#a9c5f9" stroke-width="1.5"/>
  <rect x="112" y="1040" width="284" height="38" rx="14" fill="#e1ecff"/>
  <text x="254" y="1064" font-size="15" font-weight="700" fill="#155eef" text-anchor="middle">任务状态机（9 态）</text>
  <text x="254" y="1096" font-size="13" fill="#262626" text-anchor="middle">UNKNOWN → SUBMITTED → WORKING</text>
  <text x="254" y="1120" font-size="13" fill="#262626" text-anchor="middle">WORKING ⇄ INPUT_REQUIRED / AUTH_REQUIRED</text>
  <text x="254" y="1144" font-size="13" fill="#262626" text-anchor="middle">→ COMPLETED / FAILED / CANCELED</text>
  <text x="254" y="1168" font-size="13" fill="#262626" text-anchor="middle">UNKNOWN/SUBMITTED → REJECTED（创建者）</text>
  <text x="254" y="1198" font-size="12" fill="#667085" text-anchor="middle">激活态 = {SUBMITTED, WORKING, INPUT, AUTH}</text>
  <text x="254" y="1220" font-size="12" fill="#667085" text-anchor="middle">终态不可回退 · 交互态必带 payload</text>
  <text x="254" y="1242" font-size="12" fill="#98a2b3" text-anchor="middle">每次流转 → 监听回调 + 档位重算</text>
  <path d="M 396 1148 L 438 1148" stroke="#98a2b3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="418" y="1138" font-size="11" fill="#98a2b3" text-anchor="middle">状态事件</text>
</svg>
