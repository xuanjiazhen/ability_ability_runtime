<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 630" width="980" height="630" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
    <marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="980" height="630" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">执行体验：一次「意图 + 撤销 + 重做」到底发生了什么</text>
  <text x="24" y="52" font-size="12" fill="#64748b">注册发生在 perform 内，触发发生在 App 界面；两者通过同一个撤销栈连接，且可以相隔很久</text>

  <!-- lifelines -->
  <g font-size="11.5" font-weight="700">
    <rect x="34" y="76" width="112" height="32" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="48" y="97" fill="#1e40af">用户</text>
    <rect x="228" y="76" width="144" height="32" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="242" y="97" fill="#334155">系统（Siri 等）</text>
    <rect x="424" y="76" width="152" height="32" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="438" y="97" fill="#1e40af">Intent 实例</text>
    <rect x="620" y="76" width="160" height="32" rx="5" fill="#ecfdf5" stroke="#059669"/>
    <text x="634" y="97" fill="#065f46">NSUndoManager</text>
    <rect x="816" y="76" width="130" height="32" rx="5" fill="#fff7ed" stroke="#fdba74"/>
    <text x="830" y="97" fill="#b45309">模型 store</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="5 5">
    <line x1="90" y1="108" x2="90" y2="560"/>
    <line x1="300" y1="108" x2="300" y2="560"/>
    <line x1="500" y1="108" x2="500" y2="560"/>
    <line x1="700" y1="108" x2="700" y2="560"/>
    <line x1="881" y1="108" x2="881" y2="560"/>
  </g>

  <!-- 1 -->
  <line x1="90" y1="138" x2="296" y2="138" stroke="#334155" marker-end="url(#ar)"/>
  <text x="100" y="131" font-size="10.5" fill="#334155">① 「删除 Sweet desserts」</text>
  <!-- 2 -->
  <line x1="300" y1="176" x2="496" y2="176" stroke="#334155" marker-end="url(#ar)"/>
  <text x="310" y="169" font-size="10.5" fill="#334155">② perform() 开始执行</text>
  <!-- 3 -->
  <line x1="500" y1="214" x2="877" y2="214" stroke="#0f766e" marker-end="url(#arT)"/>
  <text x="510" y="207" font-size="10.5" fill="#0f766e">③ snapshot() 取变更前快照</text>
  <!-- 4 -->
  <line x1="500" y1="252" x2="696" y2="252" stroke="#0f766e" marker-end="url(#arT)"/>
  <text x="510" y="245" font-size="10.5" fill="#0f766e">④ registerUndo + setActionName</text>
  <!-- 5 -->
  <line x1="500" y1="290" x2="877" y2="290" stroke="#0f766e" marker-end="url(#arT)"/>
  <text x="510" y="283" font-size="10.5" fill="#0f766e">⑤ delete() 真正修改数据</text>
  <!-- 6 -->
  <line x1="500" y1="326" x2="304" y2="326" stroke="#94a3b8" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="320" y="319" font-size="10.5" fill="#64748b">⑥ 返回 .result()（执行结束）</text>

  <!-- divider -->
  <line x1="40" y1="356" x2="940" y2="356" stroke="#e2e8f0"/>
  <rect x="360" y="346" width="286" height="20" rx="3" fill="#ffffff"/>
  <text x="503" y="360" font-size="10" fill="#64748b" text-anchor="middle">此后的任意时刻，用户改变主意</text>

  <!-- 7 -->
  <line x1="90" y1="400" x2="696" y2="400" stroke="#334155" marker-end="url(#ar)"/>
  <text x="100" y="393" font-size="10.5" fill="#334155">⑦ 三指左滑 → 系统调用 undo()</text>
  <!-- 8 -->
  <line x1="700" y1="438" x2="877" y2="438" stroke="#0f766e" marker-end="url(#arT)"/>
  <text x="510" y="431" font-size="10.5" fill="#0f766e">⑧ 回放闭包：store.restore(backup)</text>
  <!-- 9 -->
  <line x1="881" y1="476" x2="704" y2="476" stroke="#b45309" stroke-dasharray="4 3" marker-end="url(#arT)"/>
  <text x="540" y="469" font-size="10.5" fill="#b45309">⑨ restore 内部再次注册</text>
  <rect x="712" y="458" width="164" height="38" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="722" y="473" font-size="9.5" fill="#92400e">isUndoing 时进对侧栈</text>
  <text x="722" y="489" font-size="9.5" fill="#92400e">→ 落入 redoStack</text>

  <!-- 10 -->
  <rect x="352" y="496" width="300" height="26" rx="4" fill="#ecfdf5" stroke="#059669"/>
  <text x="362" y="513" font-size="9.5" fill="#065f46">⑩ 组整体出栈，状态复位为可注册</text>
  <!-- 11 -->
  <line x1="90" y1="546" x2="696" y2="546" stroke="#334155" marker-end="url(#ar)"/>
  <text x="100" y="539" font-size="10.5" fill="#334155">⑪ 用户再 redo() → 取出 redo 组，重放 delete()</text>

  <!-- bottom note -->
  <rect x="24" y="574" width="930" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="592" font-size="10.5" fill="#334155">⑨ 是 Redo 的唯一来源。如果 restore() 只恢复数据、不再注册反向操作，redoStack 会一直为空 —— 界面上的 Redo 永远灰着。</text>
  <text x="40" y="608" font-size="10.5" fill="#b91c1c">这是 Apple 方案里唯一需要开发者自觉遵守的隐式契约，协议层不会替你检查。</text>
</svg>
