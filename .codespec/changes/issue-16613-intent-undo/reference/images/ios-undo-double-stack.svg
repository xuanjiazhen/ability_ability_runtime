<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
  <rect width="980" height="580" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">双栈流转：Redo 是 Undo 的副产品</text>
  <text x="24" y="52" font-size="12" fill="#64748b">一次用户操作 = 一个组（可能含 N 条操作）；组在两栈间往复迁移，直到发生“分叉”</text>

  <!-- table header -->
  <text x="30" y="88" font-size="11.5" font-weight="700" fill="#475569">步骤</text>
  <text x="180" y="88" font-size="11.5" font-weight="700" fill="#047857">undoStack（顶 → 底）</text>
  <text x="570" y="88" font-size="11.5" font-weight="700" fill="#1d4ed8">redoStack（顶 → 底）</text>
  <line x1="24" y1="96" x2="956" y2="96" stroke="#e2e8f0"/>

  <!-- Row 1 -->
  <text x="30" y="126" font-size="11.5" font-weight="700" fill="#0f172a">① 用户操作 A</text>
  <text x="30" y="144" font-size="10" fill="#64748b">改了 3 个对象，</text>
  <text x="30" y="160" font-size="10" fill="#64748b">各 setter 注册逆操作</text>
  <rect x="180" y="112" width="360" height="56" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="196" y="136" font-size="11.5" font-weight="700" fill="#065f46">Group(A⁻¹) = 3 条操作</text>
  <text x="196" y="155" font-size="10" fill="#047857">run loop 自动开组 / 自动收口，合并为一组</text>
  <rect x="570" y="112" width="360" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="586" y="145" font-size="11" fill="#94a3b8">空（初始状态）</text>
  <line x1="24" y1="184" x2="956" y2="184" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <text x="30" y="214" font-size="11.5" font-weight="700" fill="#0f172a">② 按 Undo</text>
  <text x="30" y="232" font-size="10" fill="#64748b">取顶层组，倒序回放</text>
  <text x="30" y="248" font-size="10" fill="#64748b">回放期间对象再次注册</text>
  <rect x="180" y="200" width="360" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="196" y="233" font-size="11" fill="#94a3b8">空（若无更旧组）/ 保留更旧的组</text>
  <rect x="570" y="200" width="360" height="56" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="586" y="224" font-size="11.5" font-weight="700" fill="#1e40af">Group(A) = 3 条操作</text>
  <text x="586" y="243" font-size="10" fill="#1d4ed8">isUndoing == true → 注册被路由到本栈</text>
  <line x1="24" y1="272" x2="956" y2="272" stroke="#f1f5f9"/>

  <!-- Row 3 -->
  <text x="30" y="302" font-size="11.5" font-weight="700" fill="#0f172a">③ 按 Redo</text>
  <text x="30" y="320" font-size="10" fill="#64748b">镜像过程，又注册回 A⁻¹</text>
  <rect x="180" y="288" width="360" height="56" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="196" y="312" font-size="11.5" font-weight="700" fill="#065f46">Group(A⁻¹) = 3 条操作</text>
  <text x="196" y="331" font-size="10" fill="#047857">回到起点，可无限往复</text>
  <rect x="570" y="288" width="360" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="586" y="321" font-size="11" fill="#94a3b8">空</text>
  <line x1="24" y1="360" x2="956" y2="360" stroke="#f1f5f9"/>

  <!-- Row 4 -->
  <text x="30" y="390" font-size="11.5" font-weight="700" fill="#b91c1c">④ 分叉：新操作 B</text>
  <text x="30" y="408" font-size="10" fill="#64748b">新撤销注册的瞬间</text>
  <text x="30" y="424" font-size="10" fill="#64748b">旧 redo 路径永久失效</text>
  <rect x="180" y="376" width="360" height="56" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="196" y="400" font-size="11.5" font-weight="700" fill="#b45309">Group(B⁻¹)</text>
  <text x="196" y="419" font-size="10" fill="#92400e">A⁻¹ 仍在下方，可继续撤销到更早状态</text>
  <rect x="570" y="376" width="360" height="56" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="586" y="400" font-size="11.5" font-weight="700" fill="#b91c1c">Group(A) 被整体清空 ✕</text>
  <text x="586" y="419" font-size="10" fill="#991b1b">与 Git 分支被覆盖同构，不允许回到“未发生”的状态</text>

  <!-- footer note -->
  <rect x="24" y="456" width="930" height="96" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="480" font-size="12" font-weight="700" fill="#334155">为什么这套机制成立</text>
  <text x="44" y="502" font-size="11" fill="#475569">框架不存“状态快照”，只存“逆操作消息”；因此 Undo 执行时，被回滚的对象会再次注册方向相反的逆操作，</text>
  <text x="44" y="522" font-size="11" fill="#475569">而这次注册因 isUndoing 为真被写入对侧栈 —— 无需任何独立 redo 实现。代价是：撤销方法自身必须再次注册，</text>
  <text x="44" y="542" font-size="11" fill="#b91c1c">只改值不注册 = Redo 静默失效（这是开发者最高频的坑，官方确认为设计而非缺陷）。</text>
</svg>
