<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">prepareWithInvocationTarget: 如何“假装执行、实际记录”</text>
  <text x="24" y="52" font-size="12" fill="#64748b">Objective-C 消息转发机制教科书级用法：用语言层动态性，把任意调用零成本截获为一条命令记录</text>

  <!-- code strip -->
  <rect x="24" y="62" width="930" height="26" rx="4" fill="#0f172a"/>
  <text x="38" y="80" font-size="11" fill="#e2e8f0" font-family="Consolas, Menlo, monospace">[[undoManager prepareWithInvocationTarget:self] movePiece:piece toRow:row column:col];   // 方法体一次都没执行</text>

  <!-- lifelines -->
  <g font-size="11.5" font-weight="700">
    <rect x="30" y="100" width="160" height="32" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="44" y="121" fill="#1e40af">业务代码</text>
    <rect x="270" y="100" width="200" height="32" rx="5" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="284" y="121" fill="#b45309">NSUndoManager（伪装成 target）</text>
    <rect x="540" y="100" width="170" height="32" rx="5" fill="#ecfdf5" stroke="#059669"/>
    <text x="554" y="121" fill="#065f46">真实 target</text>
    <rect x="780" y="100" width="150" height="32" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="794" y="121" fill="#334155">当前 undo 组</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="5 5">
    <line x1="110" y1="132" x2="110" y2="540"/>
    <line x1="370" y1="132" x2="370" y2="540"/>
    <line x1="625" y1="132" x2="625" y2="540"/>
    <line x1="855" y1="132" x2="855" y2="540"/>
  </g>

  <!-- 1 -->
  <line x1="110" y1="160" x2="366" y2="160" stroke="#475569" marker-end="url(#ar)"/>
  <text x="120" y="153" font-size="10.5" fill="#334155">① prepareWithInvocationTarget:self</text>
  <rect x="382" y="146" width="212" height="26" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="392" y="163" font-size="10" fill="#92400e">记录 target，并返回 self（伪装）</text>

  <!-- 2 -->
  <line x1="110" y1="212" x2="366" y2="212" stroke="#475569" marker-end="url(#ar)"/>
  <text x="120" y="205" font-size="10.5" fill="#334155">② movePiece:toRow:column:（看似发给 target）</text>
  <rect x="382" y="198" width="212" height="26" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="392" y="215" font-size="10" fill="#92400e">收到一条自己不认识的 selector</text>

  <!-- 3 -->
  <line x1="270" y1="264" x2="536" y2="264" stroke="#2563eb" marker-end="url(#arB)"/>
  <text x="282" y="257" font-size="10.5" fill="#1e40af">③ methodSignatureForSelector:（代问签名）</text>
  <line x1="536" y1="296" x2="274" y2="296" stroke="#64748b" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="290" y="290" font-size="10.5" fill="#475569">NSMethodSignature（含 selector + 全部参数类型）</text>

  <!-- 4 -->
  <rect x="382" y="318" width="212" height="26" rx="4" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="392" y="335" font-size="10" fill="#92400e">④ 重写 forwardInvocation:，不转发</text>

  <!-- 5 -->
  <line x1="370" y1="372" x2="846" y2="372" stroke="#2563eb" marker-end="url(#arB)"/>
  <text x="382" y="365" font-size="10.5" fill="#1e40af">⑤ 整个 NSInvocation 原样压入当前组（而非执行）</text>

  <!-- result note -->
  <rect x="440" y="392" width="300" height="52" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="454" y="412" font-size="10.5" font-weight="700" fill="#065f46">结果：命令记录已生成</text>
  <text x="454" y="430" font-size="10" fill="#047857">target 强持有 · 参数按值固化 · 方法体未执行</text>

  <!-- bottom message -->
  <rect x="24" y="462" width="930" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="44" y="486" font-size="12.5" font-weight="700" fill="#0f172a">这条路径的三层意义</text>
  <text x="44" y="510" font-size="11" fill="#334155">1）表达能力：任意方法、任意参数都能被记录，开发者写的是自然代码，框架在消息管道里截获；</text>
  <text x="44" y="532" font-size="11" fill="#334155">2）内存语义：注册时刻的参数被复制固化，事后对象变化不影响已记录的命令（target 仍强持有）；</text>
  <text x="44" y="554" font-size="11" fill="#334155">3）可迁移性：Swift 闭包注册（registerUndo(withTarget:handler:)）出现后，这种运行时技巧的重要性下降，</text>
  <text x="62" y="574" font-size="11" fill="#334155">但“延迟执行 / 录制重放”的思想适用于埋点、事件溯源、Mock 等一切场景 —— 也正是 ArkTS 无消息转发时改用闭包的原因。</text>
  <text x="44" y="598" font-size="10.5" fill="#b45309">鸿蒙侧结论：ArkTS 没有 NSInvocation 与消息转发，因此“闭包 / 命令对象 + 可序列化凭据”是唯一自然形态。</text>
</svg>
