<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" width="980" height="680" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
  <rect width="980" height="680" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">机制映射：iOS UndoManager → 鸿蒙 IntentUndo</text>
  <text x="24" y="52" font-size="12" fill="#64748b">左两列为参照实现，右两列为本提案的落点；每一行都对应一次“能力替换”，而非照搬</text>

  <!-- header -->
  <rect x="24" y="70" width="930" height="34" rx="4" fill="#0f172a"/>
  <g font-size="11.5" font-weight="700" fill="#f8fafc">
    <text x="38" y="92">iOS NSUndoManager 机制</text>
    <text x="262" y="92">它解决的问题</text>
    <text x="466" y="92">鸿蒙对应物</text>
    <text x="710" y="92">IntentUndo 落点</text>
  </g>

  <!-- rows -->
  <g font-size="10.5">
    <!-- r1 -->
    <rect x="24" y="104" width="930" height="52" fill="#f8fafc"/>
    <text x="38" y="125" fill="#0f172a" font-weight="700">消息即命令（Invocation / 闭包）</text>
    <text x="38" y="142" fill="#64748b" font-size="9.5">只记“做什么逆操作”，不存快照</text>
    <text x="262" y="125" fill="#334155">内存开销最小</text>
    <text x="262" y="142" fill="#64748b" font-size="9.5">一步一条消息，而非全量状态</text>
    <text x="466" y="125" fill="#0f172a" font-weight="700">ArkTS 闭包 / 命令对象</text>
    <text x="466" y="142" fill="#b45309" font-size="9.5">无 NSInvocation、无消息转发</text>
    <text x="710" y="125" fill="#0f172a" font-weight="700">可序列化凭据</text>
    <text x="710" y="142" fill="#64748b" font-size="9.5">(params, executeResult) → JSON</text>

    <!-- r2 -->
    <rect x="24" y="156" width="930" height="52" fill="#ffffff"/>
    <text x="38" y="177" fill="#0f172a" font-weight="700">双栈 + 组结构</text>
    <text x="38" y="194" fill="#64748b" font-size="9.5">组是原子回放单位</text>
    <text x="262" y="177" fill="#334155">多对象变更一次撤完</text>
    <text x="262" y="194" fill="#64748b" font-size="9.5">undo / redo 两栈迁移</text>
    <text x="466" y="177" fill="#0f172a" font-weight="700">自建 IntentUndoManager</text>
    <text x="466" y="194" fill="#64748b" font-size="9.5">双栈 + 组，宿主在应用进程</text>
    <text x="710" y="177" fill="#0f172a" font-weight="700">一次意图执行 = 一组</text>
    <text x="710" y="194" fill="#64748b" font-size="9.5">业务事务天然成组</text>

    <!-- r3 -->
    <rect x="24" y="208" width="930" height="52" fill="#f8fafc"/>
    <text x="38" y="229" fill="#0f172a" font-weight="700">Run Loop 自动分组</text>
    <text x="38" y="246" fill="#64748b" font-size="9.5">groupsByEvent 默认开启</text>
    <text x="262" y="229" fill="#334155">事件边界 = 事务边界</text>
    <text x="262" y="246" fill="#64748b" font-size="9.5">一致性从开发者责任降为默认</text>
    <text x="466" y="229" fill="#0f172a" font-weight="700">无 run loop hook</text>
    <text x="466" y="246" fill="#b45309" font-size="9.5">模型层改显式组 / 事件回调边界</text>
    <text x="710" y="229" fill="#0f172a" font-weight="700">无需分组机制</text>
    <text x="710" y="246" fill="#64748b" font-size="9.5">意图执行起止即事务边界</text>

    <!-- r4 -->
    <rect x="24" y="260" width="930" height="52" fill="#ffffff"/>
    <text x="38" y="281" fill="#0f172a" font-weight="700">Redo = 执行期反向注册</text>
    <text x="38" y="298" fill="#64748b" font-size="9.5">isUndoing 时注册落到对侧栈</text>
    <text x="262" y="281" fill="#334155">零成本获得 Redo</text>
    <text x="262" y="298" fill="#b91c1c" font-size="9.5">撤销方法不注册则 Redo 静默失效</text>
    <text x="466" y="281" fill="#0f172a" font-weight="700">需显式 onRedo</text>
    <text x="466" y="298" fill="#64748b" font-size="9.5">意图是黑盒业务，无法自动求逆</text>
    <text x="710" y="281" fill="#0f172a" font-weight="700">引擎保存执行结果</text>
    <text x="710" y="298" fill="#64748b" font-size="9.5">onRedo 通常直接委托 onExecute</text>

    <!-- r5 -->
    <rect x="24" y="312" width="930" height="52" fill="#f8fafc"/>
    <text x="38" y="333" fill="#0f172a" font-weight="700">强持有 target 与参数</text>
    <text x="38" y="350" fill="#64748b" font-size="9.5">removeAllActions(withTarget:) 清理</text>
    <text x="262" y="333" fill="#334155">记录可靠但延长对象生命周期</text>
    <text x="262" y="350" fill="#64748b" font-size="9.5">长期存活的 manager 需主动清理</text>
    <text x="466" y="333" fill="#0f172a" font-weight="700">闭包捕获是强引用</text>
    <text x="466" y="350" fill="#b45309" font-size="9.5">靠参数回传 target + 显式清理</text>
    <text x="710" y="333" fill="#0f172a" font-weight="700">执行器无状态</text>
    <text x="710" y="350" fill="#64748b" font-size="9.5">凭据替代闭包，天然无捕获</text>

    <!-- r6 -->
    <rect x="24" y="364" width="930" height="52" fill="#ffffff"/>
    <text x="38" y="385" fill="#0f172a" font-weight="700">可丢弃组（discardable）</text>
    <text x="38" y="402" fill="#64748b" font-size="9.5">区分“撤销打字”与“撤销操作”</text>
    <text x="262" y="385" fill="#334155">避免无意义撤销项</text>
    <text x="466" y="385" fill="#0f172a" font-weight="700">undoable 能力声明</text>
    <text x="466" y="402" fill="#64748b" font-size="9.5">配置文件 / 装饰器参数</text>
    <text x="710" y="385" fill="#0f172a" font-weight="700">未实现 onCancel = 不入栈</text>
    <text x="710" y="402" fill="#64748b" font-size="9.5">导航、纯查询类意图自动排除</text>

    <!-- r7 -->
    <rect x="24" y="416" width="930" height="52" fill="#f8fafc"/>
    <text x="38" y="437" fill="#0f172a" font-weight="700">响应链查找 undoManager</text>
    <text x="38" y="454" fill="#64748b" font-size="9.5">重写属性即可返回私有实例</text>
    <text x="262" y="437" fill="#334155">局部撤销互不污染</text>
    <text x="466" y="437" fill="#0f172a" font-weight="700">@Provide / @Consume 注入</text>
    <text x="466" y="454" fill="#64748b" font-size="9.5">无响应链，靠组件树作用域</text>
    <text x="710" y="437" fill="#0f172a" font-weight="700">应用内单例</text>
    <text x="710" y="454" fill="#64748b" font-size="9.5">小艺 / 卡片 / 应用内共享同一栈</text>

    <!-- r8 -->
    <rect x="24" y="468" width="930" height="52" fill="#ffffff"/>
    <text x="38" y="489" fill="#0f172a" font-weight="700">无持久化</text>
    <text x="38" y="506" fill="#64748b" font-size="9.5">杀进程即丢，需自建</text>
    <text x="262" y="489" fill="#334155">跨会话撤销缺失</text>
    <text x="466" y="489" fill="#0f172a" font-weight="700">需自建持久化</text>
    <text x="466" y="506" fill="#64748b" font-size="9.5">ArkTS 侧无现成栈快照设施</text>
    <text x="710" y="489" fill="#0f172a" font-weight="700">ToJsonString 落盘</text>
    <text x="710" y="506" fill="#047857" font-size="9.5">凭据可序列化 → 跨重启撤销</text>

    <!-- r9 -->
    <rect x="24" y="520" width="930" height="52" fill="#f8fafc"/>
    <text x="38" y="541" fill="#0f172a" font-weight="700">仅覆盖应用内 UI 操作</text>
    <text x="38" y="558" fill="#64748b" font-size="9.5">外部入口（Siri 等）无法被撤销</text>
    <text x="262" y="541" fill="#334155">入口割裂</text>
    <text x="466" y="541" fill="#0f172a" font-weight="700">意图是跨入口统一入口</text>
    <text x="466" y="558" fill="#64748b" font-size="9.5">小艺 / 卡片 / 跨设备 / 应用内</text>
    <text x="710" y="541" fill="#0f172a" font-weight="700">凭据随意图走</text>
    <text x="710" y="558" fill="#047857" font-size="9.5">应用外触发的操作同样可撤销</text>
  </g>

  <line x1="24" y1="104" x2="954" y2="104" stroke="#e2e8f0"/>
  <line x1="250" y1="70" x2="250" y2="572" stroke="#e2e8f0"/>
  <line x1="454" y1="70" x2="454" y2="572" stroke="#e2e8f0"/>
  <line x1="698" y1="70" x2="698" y2="572" stroke="#e2e8f0"/>

  <!-- note -->
  <rect x="24" y="592" width="930" height="72" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="44" y="614" font-size="11.5" font-weight="700" fill="#c2410c">一句话总结映射关系</text>
  <text x="44" y="636" font-size="11" fill="#7c2d12">iOS 用“语言的动态性”记录命令，鸿蒙用“结构化数据”记录事务：前者零成本表达任意逆操作，后者天然可序列化、可跨进程、</text>
  <text x="44" y="656" font-size="11" fill="#7c2d12">可跨会话。取舍点在于——闭包赢在表达力，凭据赢在可持久化与跨入口。</text>
</svg>
