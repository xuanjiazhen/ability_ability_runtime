<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
    <marker id="arP" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="980" height="600" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">执行视角：普通意图「执行完即消失」，可撤销意图「在进程里留下遗产」</text>
  <text x="24" y="52" font-size="11.5" fill="#64748b">同样的触发方式、同样的 perform 签名，但后者的生命周期终点不在 return，而在用户下一次按下撤销——可能是几分钟后，也可能永远不来。</text>

  <!-- ===== A: plain ===== -->
  <text x="24" y="80" font-size="11" font-weight="700" fill="#475569">A · 普通 AppIntent</text>
  <g>
    <rect x="24" y="90" width="196" height="58" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="38" y="112" font-size="10.5" font-weight="700" fill="#0f172a">系统分发 · 实例化</text>
    <text x="38" y="131" font-size="9.2" fill="#64748b">Siri / 快捷指令 / 卡片 / Spotlight</text>

    <line x1="224" y1="119" x2="268" y2="119" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="272" y="90" width="220" height="58" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="286" y="112" font-size="10.5" font-weight="700" fill="#1e40af">perform()</text>
    <text x="286" y="131" font-size="9.2" fill="#3b82f6">业务逻辑；唯一的失败点是 throw</text>

    <line x1="496" y1="119" x2="540" y2="119" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="544" y="90" width="176" height="58" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="558" y="112" font-size="10.5" font-weight="700" fill="#0f172a">返回 .result()</text>
    <text x="558" y="131" font-size="9.2" fill="#64748b">结果回传系统，到此结束</text>

    <line x1="724" y1="119" x2="768" y2="119" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="772" y="90" width="184" height="58" rx="7" fill="#f1f5f9" stroke="#e2e8f0" stroke-dasharray="4 3"/>
    <text x="786" y="112" font-size="10.5" font-weight="700" fill="#64748b">实例释放 · 无残留</text>
    <text x="786" y="131" font-size="9.2" fill="#94a3b8">进程里不再有任何痕迹</text>
  </g>
  <text x="24" y="168" font-size="9.4" fill="#94a3b8">内存足迹 O(参数)；不存在「执行完之后还要被谁引用」的问题。</text>

  <!-- ===== B: undoable ===== -->
  <text x="24" y="200" font-size="11" font-weight="700" fill="#6d28d9">B · 可撤销 AppIntent（UndoableIntent）</text>
  <g>
    <rect x="24" y="210" width="140" height="72" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="36" y="232" font-size="10" font-weight="700" fill="#0f172a">① 分发 · 实例化</text>
    <text x="36" y="250" font-size="8.8" fill="#64748b">入口与普通意图相同</text>

    <line x1="168" y1="246" x2="196" y2="246" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="200" y="210" width="150" height="72" rx="7" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="212" y="232" font-size="10" font-weight="700" fill="#5b21b6">② perform()</text>
    <text x="212" y="250" font-size="8.8" fill="#7c3aed">@MainActor 隔离</text>
    <text x="212" y="266" font-size="8.8" fill="#7c3aed">async 可能跨事件周期</text>

    <line x1="354" y1="246" x2="382" y2="246" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="386" y="210" width="146" height="72" rx="7" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="398" y="232" font-size="10" font-weight="700" fill="#5b21b6">③ 注入撤销栈</text>
    <text x="398" y="250" font-size="8.8" fill="#7c3aed">undoManager? ← 系统挑</text>
    <text x="398" y="266" font-size="8.8" fill="#dc2626">可能为 nil（见下方分支）</text>

    <line x1="536" y1="246" x2="564" y2="246" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="568" y="210" width="170" height="72" rx="7" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="580" y="232" font-size="10" font-weight="700" fill="#5b21b6">④ 快照 → 注册</text>
    <text x="580" y="250" font-size="8.8" fill="#7c3aed">闭包 + 快照 + target</text>
    <text x="580" y="266" font-size="8.8" fill="#7c3aed">写入 undoStack 的当前组</text>

    <line x1="742" y1="246" x2="770" y2="246" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

    <rect x="774" y="210" width="182" height="72" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="786" y="232" font-size="10" font-weight="700" fill="#1e40af">⑤ 变更 → .result()</text>
    <text x="786" y="250" font-size="8.8" fill="#3b82f6">组收口 · 意图实例被释放</text>
    <text x="786" y="266" font-size="8.8" fill="#1d4ed8">但栈里的条目继续存活</text>
  </g>

  <!-- nil branch -->
  <path d="M459,286 L459,306" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <rect x="330" y="310" width="300" height="40" rx="7" fill="#fef2f2" stroke="#fecaca"/>
  <text x="342" y="328" font-size="9.6" font-weight="700" fill="#b91c1c">um == nil → 照常执行，撤销能力静默缺失</text>
  <text x="342" y="343" font-size="8.8" fill="#991b1b">普通意图没有这条分支，所以也不会踩到它</text>

  <!-- boundary callout -->
  <line x1="756" y1="196" x2="756" y2="392" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="400" y="360" width="556" height="42" rx="7" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="414" y="378" font-size="9.8" font-weight="700" fill="#6d28d9">↑ 这条线之后，意图实例可能早已销毁 —— 但 undoStack 仍强持有：闭包 + 快照 + target 对象</text>
  <text x="414" y="394" font-size="9.2" fill="#7c3aed">普通意图的生命周期终点是 return；可撤销意图的终点是「用户下一次撤销」，也可能永不到来。</text>

  <!-- collapse / undo path -->
  <rect x="24" y="410" width="330" height="58" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="38" y="431" font-size="10" font-weight="700" fill="#047857">⑥ 用户手势 undo()（数分钟后）</text>
  <text x="38" y="449" font-size="8.9" fill="#065f46">倒序回放组内闭包；此时意图类型早已不在调用栈上</text>
  <text x="38" y="462" font-size="8.9" fill="#065f46">回放调用 restore()，restore 内再注册 → 落进 redoStack</text>

  <line x1="358" y1="439" x2="386" y2="439" stroke="#059669" stroke-width="1.4" marker-end="url(#arG)"/>

  <rect x="390" y="410" width="272" height="58" rx="7" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="404" y="431" font-size="10" font-weight="700" fill="#047857">⑦ redo() 镜像</text>
  <text x="404" y="449" font-size="8.9" fill="#065f46">redoStack 组回放 → 再次反向注册</text>
  <text x="404" y="462" font-size="8.9" fill="#065f46">回到 undoStack；协议层零参与</text>

  <rect x="676" y="410" width="280" height="58" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="690" y="431" font-size="10" font-weight="700" fill="#92400e">⑧ 栈被新操作改写</text>
  <text x="690" y="449" font-size="8.9" fill="#78350f">任何新注册都会清空 redoStack</text>
  <text x="690" y="462" font-size="8.9" fill="#78350f">用户撤到一半再操作，重做历史即失效</text>

  <!-- bottom: failure surface -->
  <rect x="24" y="482" width="932" height="102" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="503" font-size="10.5" font-weight="700" fill="#0f172a">执行完成后的可观测性差异 —— 普通意图只有 1 条失败路径，可撤销意图有 5 条，其中 3 条完全静默</text>
  <g font-size="9.3">
    <text x="40" y="523" fill="#475569">① perform 抛错<tspan fill="#94a3b8"> —— 两版相同，错误冒泡到系统，用户可见</tspan></text>
    <text x="40" y="541" fill="#b91c1c">② undoManager == nil<tspan fill="#94a3b8"> —— 业务照做，但用户事后发现撤不了（无日志）</tspan></text>
    <text x="40" y="559" fill="#b91c1c">③ 变更失败但已注册<tspan fill="#94a3b8"> —— 留下一个「撤销从未发生的变更」的悬挂条目</tspan></text>
    <text x="500" y="523" fill="#b91c1c">④ 变更成功但未注册 / 顺序写反<tspan fill="#94a3b8"> —— 不可撤销，且无任何报错</tspan></text>
    <text x="500" y="541" fill="#b91c1c">⑤ restore 内忘了再注册<tspan fill="#94a3b8"> —— Redo 永久置灰，被误判为系统 bug</tspan></text>
    <text x="500" y="559" fill="#475569">②–⑤ 都不抛异常，只能靠单测与断言兜住（见正文 §5.6）</text>
  </g>
</svg>
