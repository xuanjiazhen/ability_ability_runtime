<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 604" width="980" height="604" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', sans-serif">
  <rect width="980" height="604" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">同一个业务，两版实现：普通 AppIntent vs 可撤销 AppIntent</text>
  <text x="24" y="52" font-size="11.5" fill="#64748b">业务完全相同（删除一个集合）。差异只集中在「声明、线程、判空、快照、注册、命名」六处，其余代码逐字相同。</text>

  <!-- ============ LEFT: plain ============ -->
  <rect x="24" y="70" width="448" height="318" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="40" y="84" width="118" height="22" rx="11" fill="#e2e8f0"/>
  <text x="99" y="99" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">普通 AppIntent</text>
  <text x="170" y="99" font-size="10.5" fill="#94a3b8">只需 title + perform，执行完即结束</text>

  <rect x="40" y="118" width="416" height="230" rx="6" fill="#0f172a"/>
  <g font-family="Consolas, monospace" font-size="8.7" fill="#e2e8f0">
    <text x="52" y="138">struct DeleteCollectionIntent: AppIntent {</text>
    <text x="52" y="156" fill="#93c5fd">static let</text>
    <text x="118" y="156">title: LocalizedStringResource = "删除集合"</text>
    <text x="52" y="174">@Parameter var collection: CollectionEntity</text>
    <text x="52" y="192">@Dependency var store: CollectionStore</text>
    <text x="52" y="216" fill="#93c5fd">func</text>
    <text x="88" y="216">perform() async throws -&gt; some IntentResult {</text>
    <text x="68" y="234" fill="#fca5a5">try await</text>
    <text x="128" y="234">store.delete(collection)</text>
    <text x="68" y="252">WidgetCenter.shared.reloadTimelines(...)</text>
    <text x="68" y="270" fill="#93c5fd">return</text>
    <text x="112" y="270">.result()</text>
    <text x="52" y="288">}</text>
    <text x="52" y="306">}</text>
  </g>
  <text x="52" y="332" font-size="9" fill="#64748b">没有栈、没有快照、没有逆操作 —— 删了就是删了。</text>

  <!-- ============ RIGHT: undoable ============ -->
  <rect x="492" y="70" width="464" height="412" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="508" y="84" width="176" height="22" rx="11" fill="#7c3aed"/>
  <text x="596" y="99" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">可撤销 AppIntent（iOS 26+）</text>
  <text x="696" y="99" font-size="10.5" fill="#7c3aed">多 1 个协议 + 9 行代码</text>

  <rect x="508" y="118" width="432" height="352" rx="6" fill="#0f172a"/>
  <g font-family="Consolas, monospace" font-size="8.7" fill="#e2e8f0">
    <text x="530" y="138">struct DeleteCollectionIntent: AppIntent, UndoableIntent {</text>
    <text x="530" y="156" fill="#93c5fd">static let</text>
    <text x="596" y="156">title: LocalizedStringResource = "删除集合"</text>
    <text x="530" y="174">static var allowedExecutionTargets: ... { .main }</text>
    <text x="530" y="192">@Parameter var collection: CollectionEntity</text>
    <text x="530" y="210">@Dependency var store: CollectionStore</text>
    <text x="530" y="234" fill="#c4b5fd">@MainActor</text>
    <text x="530" y="252" fill="#93c5fd">func</text>
    <text x="566" y="252">perform() async throws -&gt; some IntentResult {</text>
    <text x="546" y="270" fill="#fca5a5">guard let</text>
    <text x="600" y="270">um = undoManager </text>
    <text x="690" y="270" fill="#94a3b8">else { ... }</text>
    <text x="546" y="288" fill="#c4b5fd">let</text>
    <text x="568" y="288">backup = collection.snapshot()</text>
    <text x="546" y="306" fill="#c4b5fd">um.beginUndoGrouping()</text>
    <text x="546" y="324" fill="#c4b5fd">defer { um.endUndoGrouping() }</text>
    <text x="546" y="348" fill="#fca5a5">try await</text>
    <text x="606" y="348">store.delete(collection)</text>
    <text x="546" y="366" fill="#86efac">um.registerUndo(withTarget: store) {</text>
    <text x="562" y="382" fill="#86efac">$0.restore(backup)</text>
    <text x="546" y="398" fill="#86efac">}</text>
    <text x="546" y="416" fill="#86efac">um.setActionName("删除\(collection.name)")</text>
    <text x="546" y="434">WidgetCenter.shared.reloadTimelines(...)</text>
    <text x="546" y="450" fill="#93c5fd">return</text>
    <text x="590" y="450">.result()</text>
  </g>
  <text x="530" y="466" fill="#e2e8f0" font-family="Consolas, monospace" font-size="8.7">}</text>

  <!-- delta markers -->
  <g font-size="8.2" font-weight="700" text-anchor="middle">
    <circle cx="516" cy="135" r="7" fill="#7c3aed"/><text x="516" y="138" fill="#fff">1</text>
    <circle cx="516" cy="171" r="7" fill="#7c3aed"/><text x="516" y="174" fill="#fff">2</text>
    <circle cx="516" cy="231" r="7" fill="#7c3aed"/><text x="516" y="234" fill="#fff">3</text>
    <circle cx="516" cy="267" r="7" fill="#dc2626"/><text x="516" y="270" fill="#fff">4</text>
    <circle cx="532" cy="285" r="7" fill="#7c3aed"/><text x="532" y="288" fill="#fff">5</text>
    <circle cx="532" cy="363" r="7" fill="#059669"/><text x="532" y="366" fill="#fff">6</text>
  </g>

  <!-- ============ BOTTOM: delta list ============ -->
  <rect x="24" y="414" width="456" height="120" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="40" y="435" font-size="11" font-weight="700" fill="#92400e">六处差异（编号对应右侧代码）</text>
  <g font-size="9.6" fill="#78350f">
    <text x="40" y="455">① 遵守 UndoableIntent —— 协议一致性即声明，无字段无注册表</text>
    <text x="40" y="473">② 钉死执行目标 —— 扩展进程里靠系统「找宿主」会拿到 nil</text>
    <text x="40" y="491">③ perform 标 @MainActor —— undoManager 是主线程隔离属性</text>
    <text x="40" y="509">④ 判空降级 —— 拿不到栈也要把业务做完，只是这次不可撤销</text>
    <text x="40" y="527">⑤ 变更前快照 + 显式分组 —— 防 await 把一次事务拆成多组</text>
  </g>

  <rect x="492" y="486" width="464" height="48" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="508" y="505" font-size="9.6" font-weight="700" fill="#166534">⑥ 变更成功后注册逆操作 + setActionName</text>
  <text x="508" y="522" font-size="9.3" fill="#15803d">顺序不能反：先变更后注册，失败路径才不会留下悬挂的撤销条目。</text>

  <!-- implicit contract -->
  <rect x="24" y="546" width="932" height="46" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="565" font-size="10.2" font-weight="700" fill="#b91c1c">代码之外还有一条协议不会检查的隐式契约</text>
  <text x="40" y="582" font-size="9.6" fill="#7f1d1d">撤销时被回放的 <tspan font-family="Consolas, monospace">store.restore(backup)</tspan> 必须自己再 <tspan font-family="Consolas, monospace">registerUndo</tspan> 一次，否则 Redo 永久置灰且零报错 —— 这是整条链路唯一靠自觉的地方。</text>
</svg>
