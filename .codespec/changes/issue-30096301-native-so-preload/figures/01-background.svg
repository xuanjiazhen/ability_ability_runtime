<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0.0" y="0.0" width="1920.0" height="1080.0" fill="#F5F7FA"/><rect x="0.0" y="0.0" width="1920.0" height="108.0" fill="#E8F0FE"/><rect x="0.0" y="104.0" width="1920.0" height="4.0" fill="#2F6FEB"/><text x="64.0" y="68.0" font-family="Microsoft YaHei" font-size="38" font-weight="bold" fill="#1F2733">背景与需求价值</text><text x="64.0" y="96.0" font-family="Microsoft YaHei" font-size="20" fill="#5A6472">RR-30096301 · 启动阶段 Native 模块采集与跨启动预测预加载系统 SO</text><rect x="60.0" y="150.0" width="880.0" height="380.0" fill="#FFFFFF" rx="14" stroke="#D0D7E2" stroke-width="2"/><rect x="60.0" y="150.0" width="880.0" height="8.0" fill="#C0392B" rx="4"/><text x="86.0" y="196.0" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#C0392B">需求背景与痛点</text><text x="86.0" y="236.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">应用冷启动时，启动阶段实际加载的 Native 模块集合对系统不可见，无法支撑依赖</text><text x="86.0" y="270.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">分析与启动优化。</text><text x="86.0" y="304.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">启动框架预加载配置为静态列表，无法随应用实际加载行为自我演化。</text><rect x="980.0" y="150.0" width="880.0" height="380.0" fill="#FFFFFF" rx="14" stroke="#D0D7E2" stroke-width="2"/><rect x="980.0" y="150.0" width="880.0" height="8.0" fill="#2F6FEB" rx="4"/><text x="1006.0" y="196.0" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#2F6FEB">需求价值</text><text x="1006.0" y="236.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">补齐启动阶段模块依赖对系统的可视性。</text><text x="1006.0" y="270.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">跨启动预测下一次启动将加载的系统模块。</text><text x="1006.0" y="304.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">启动框架预加载系统 so，缩短应用真实 import 时的加载耗时，优化应用冷启动。</text><rect x="60.0" y="560.0" width="880.0" height="380.0" fill="#FFFFFF" rx="14" stroke="#D0D7E2" stroke-width="2"/><rect x="60.0" y="560.0" width="880.0" height="8.0" fill="#2E9E6B" rx="4"/><text x="86.0" y="606.0" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#2E9E6B">需求输出与验收</text><text x="86.0" y="646.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">输出①：能够采集到启动阶段加载的模块。</text><text x="86.0" y="679.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">输出②：基于此前采集到的模块预加载信息进行预加载。</text><text x="86.0" y="712.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">验收①：正确保存到 cacheDir 下。</text><text x="86.0" y="745.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">验收②：基于此前采集到的模块进行预加载。</text><text x="86.0" y="778.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">验收③：文件异常或不存在不影响应用启动。</text><rect x="980.0" y="560.0" width="880.0" height="380.0" fill="#FFFFFF" rx="14" stroke="#D0D7E2" stroke-width="2"/><rect x="980.0" y="560.0" width="880.0" height="8.0" fill="#C97A16" rx="4"/><text x="1006.0" y="606.0" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#C97A16">范围与边界</text><text x="1006.0" y="646.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">设备：PC/手机/平板默认支持（系统参数控制），其他设备默认不支持。</text><text x="1006.0" y="679.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">交付仓：ability_runtime + napi 两仓；外部依赖 musl dlopen_preload。</text><text x="1006.0" y="712.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">不涉及：性能功耗指标（仅承载功能）、应用兼容性、公共 API。</text></svg>