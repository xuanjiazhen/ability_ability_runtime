<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0.0" y="0.0" width="1920.0" height="1080.0" fill="#F5F7FA"/><rect x="0.0" y="0.0" width="1920.0" height="108.0" fill="#E8F0FE"/><rect x="0.0" y="104.0" width="1920.0" height="4.0" fill="#2F6FEB"/><text x="64.0" y="68.0" font-family="Microsoft YaHei" font-size="38" font-weight="bold" fill="#1F2733">现状（改造前）</text><text x="64.0" y="96.0" font-family="Microsoft YaHei" font-size="20" fill="#5A6472">启动加载行为不可见；预加载依赖发布时静态配置</text><rect x="80.0" y="300.0" width="360.0" height="130.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><text x="195.0" y="356.0" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#1F2733">应用冷启动</text><text x="218.0" y="392.0" font-family="Microsoft YaHei" font-size="21" fill="#5A6472">进程拉起</text><line x1="440.0" y1="365.0" x2="516.0" y2="365.0" stroke="#2F6FEB" stroke-width="3"/><path d="M 540.0 365.0 L 515.0 355.0 L 515.0 375.0 Z" fill="#2F6FEB"/><rect x="540.0" y="300.0" width="520.0" height="130.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><text x="644.4" y="356.0" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#1F2733">JS/Native import 系统 so</text><text x="699.2" y="392.0" font-family="Microsoft YaHei" font-size="21" fill="#5A6472">启动阶段按需 import</text><line x1="1060.0" y1="365.0" x2="1136.0" y2="365.0" stroke="#2F6FEB" stroke-width="3"/><path d="M 1160.0 365.0 L 1135.0 355.0 L 1135.0 375.0 Z" fill="#2F6FEB"/><rect x="1160.0" y="300.0" width="680.0" height="130.0" fill="#FBE6E4" rx="12" stroke="#C0392B" stroke-width="2"/><text x="1317.5" y="356.0" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#C0392B">系统 so 在真实 import 时才加载</text><text x="1374.0" y="392.0" font-family="Microsoft YaHei" font-size="21" fill="#5A6472">耗时直接落在启动关键路径</text><rect x="80.0" y="560.0" width="360.0" height="130.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><text x="169.0" y="616.0" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#1F2733">启动框架预加载</text><text x="218.0" y="652.0" font-family="Microsoft YaHei" font-size="21" fill="#5A6472">现有能力</text><line x1="440.0" y1="625.0" x2="516.0" y2="625.0" stroke="#2F6FEB" stroke-width="3"/><path d="M 540.0 625.0 L 515.0 615.0 L 515.0 635.0 Z" fill="#2F6FEB"/><rect x="540.0" y="560.0" width="520.0" height="130.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><text x="680.6" y="616.0" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#1F2733">静态 allowlist 配置</text><text x="588.2" y="652.0" font-family="Microsoft YaHei" font-size="21" fill="#5A6472">/etc/ability_runtime_app_startup.json</text><line x1="1060.0" y1="625.0" x2="1136.0" y2="625.0" stroke="#2F6FEB" stroke-width="3"/><path d="M 1160.0 625.0 L 1135.0 615.0 L 1135.0 635.0 Z" fill="#2F6FEB"/><rect x="1160.0" y="560.0" width="680.0" height="130.0" fill="#FBEFD9" rx="12" stroke="#C97A16" stroke-width="2"/><text x="1329.5" y="616.0" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#C97A16">systemPreloadSoAllowList</text><text x="1353.0" y="652.0" font-family="Microsoft YaHei" font-size="21" fill="#5A6472">发布时固定，不随应用行为演化</text><rect x="80.0" y="780.0" width="1760.0" height="220.0" fill="#FFFFFF" rx="14" stroke="#D0D7E2" stroke-width="2"/><rect x="80.0" y="780.0" width="1760.0" height="8.0" fill="#C0392B" rx="4"/><text x="112.0" y="836.0" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#C0392B">现状问题</text><circle cx="120.0" cy="878.6" r="4" fill="#C0392B"/><text x="138.0" y="886.0" font-family="Microsoft YaHei" font-size="23" fill="#1F2733">启动期实际 import 的模块集合对系统不可见 → 无依赖数据、无法预测</text><circle cx="120.0" cy="924.6" r="4" fill="#C0392B"/><text x="138.0" y="932.0" font-family="Microsoft YaHei" font-size="23" fill="#1F2733">预加载只能依赖静态 allowlist → 与应用真实加载行为脱节</text><circle cx="120.0" cy="970.6" r="4" fill="#C0392B"/><text x="138.0" y="978.0" font-family="Microsoft YaHei" font-size="23" fill="#1F2733">结果：系统 so 加载耗时无法针对性优化</text></svg>