<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0.0" y="0.0" width="1920.0" height="1080.0" fill="#F5F7FA"/><rect x="0.0" y="0.0" width="1920.0" height="108.0" fill="#E8F0FE"/><rect x="0.0" y="104.0" width="1920.0" height="4.0" fill="#2F6FEB"/><text x="64.0" y="68.0" font-family="Microsoft YaHei" font-size="38" font-weight="bold" fill="#1F2733">规格（验收标准 AC 摘要）</text><text x="64.0" y="96.0" font-family="Microsoft YaHei" font-size="20" fill="#5A6472">10 条 AC：采集 / 预测 / 预加载 / 防自反馈 / 降级 / 并发</text><rect x="60.0" y="156.0" width="352.0" height="196.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><rect x="60.0" y="156.0" width="352.0" height="6.0" fill="#2E9E6B" rx="3"/><text x="82.0" y="208.0" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#2E9E6B">AC-1</text><text x="82.0" y="248.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">采集启动阶段显式 import 的系</text><text x="82.0" y="282.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">统模块名</text><rect x="432.0" y="156.0" width="352.0" height="196.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><rect x="432.0" y="156.0" width="352.0" height="6.0" fill="#2F6FEB" rx="3"/><text x="454.0" y="208.0" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#2F6FEB">AC-2</text><text x="454.0" y="248.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">EWMA 预测预测集，tmp+rename</text><text x="454.0" y="282.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733"> 原子落盘 cacheDir 子目录</text><rect x="804.0" y="156.0" width="352.0" height="196.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><rect x="804.0" y="156.0" width="352.0" height="6.0" fill="#2F6FEB" rx="3"/><text x="826.0" y="208.0" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#2F6FEB">AC-3</text><text x="826.0" y="248.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">下次启动非主线程对系统模块执</text><text x="826.0" y="282.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">行预加载，不阻塞主线程</text><rect x="1176.0" y="156.0" width="352.0" height="196.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><rect x="1176.0" y="156.0" width="352.0" height="6.0" fill="#6B4FBB" rx="3"/><text x="1198.0" y="208.0" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#6B4FBB">AC-4</text><text x="1198.0" y="248.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">防自反馈：预加载的模块不计为</text><text x="1198.0" y="282.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">本轮采集命中</text><rect x="1548.0" y="156.0" width="352.0" height="196.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><rect x="1548.0" y="156.0" width="352.0" height="6.0" fill="#C97A16" rx="3"/><text x="1570.0" y="208.0" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#C97A16">AC-5</text><text x="1570.0" y="248.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">开关关闭或设备不支持时全链路</text><text x="1570.0" y="282.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">不生效</text><rect x="60.0" y="374.0" width="352.0" height="196.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><rect x="60.0" y="374.0" width="352.0" height="6.0" fill="#C0392B" rx="3"/><text x="82.0" y="426.0" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#C0392B">AC-6</text><text x="82.0" y="466.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">文件缺失/损坏/写失败时降级，</text><text x="82.0" y="500.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">不影响应用启动</text><rect x="432.0" y="374.0" width="352.0" height="196.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><rect x="432.0" y="374.0" width="352.0" height="6.0" fill="#C0392B" rx="3"/><text x="454.0" y="426.0" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#C0392B">AC-7</text><text x="454.0" y="466.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">单个系统模块预加载失败记录故</text><text x="454.0" y="500.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">障事件并继续</text><rect x="804.0" y="374.0" width="352.0" height="196.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><rect x="804.0" y="374.0" width="352.0" height="6.0" fill="#2F6FEB" rx="3"/><text x="826.0" y="426.0" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#2F6FEB">AC-8</text><text x="826.0" y="466.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">napi 查询接口仅返回已加载系统</text><text x="826.0" y="500.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">模块名</text><rect x="1176.0" y="374.0" width="352.0" height="196.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><rect x="1176.0" y="374.0" width="352.0" height="6.0" fill="#6B4FBB" rx="3"/><text x="1198.0" y="426.0" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#6B4FBB">AC-9</text><text x="1198.0" y="466.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">同一应用多实例并发冷启动，预</text><text x="1198.0" y="500.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">测结果合并不丢失</text><rect x="1548.0" y="374.0" width="352.0" height="196.0" fill="#FFFFFF" rx="12" stroke="#D0D7E2" stroke-width="2"/><rect x="1548.0" y="374.0" width="352.0" height="6.0" fill="#2E9E6B" rx="3"/><text x="1570.0" y="426.0" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#2E9E6B">AC-10</text><text x="1570.0" y="466.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">单元测试覆盖采集/预测/降级/并</text><text x="1570.0" y="500.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">发等全路径</text><rect x="60.0" y="600.0" width="900.0" height="200.0" fill="#FFFFFF" rx="14" stroke="#D0D7E2" stroke-width="2"/><rect x="60.0" y="600.0" width="900.0" height="8.0" fill="#2F6FEB" rx="4"/><text x="86.0" y="652.0" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#2F6FEB">新增 InnerAPI（napi）</text><text x="86.0" y="704.0" font-family="Microsoft YaHei" font-size="23" fill="#1F2733">GetLoadedSystemNativeModules()</text><text x="86.0" y="744.0" font-family="Microsoft YaHei" font-size="23" fill="#1F2733">PreloadSystemNativeModule(moduleName)</text><text x="86.0" y="782.0" font-family="Microsoft YaHei" font-size="20" fill="#5A6472">仅系统模块；预加载内部拼接路径并调用 dlopen_preload</text><rect x="980.0" y="600.0" width="880.0" height="200.0" fill="#FFFFFF" rx="14" stroke="#D0D7E2" stroke-width="2"/><rect x="980.0" y="600.0" width="880.0" height="8.0" fill="#EEF1F6" rx="4"/><text x="1006.0" y="652.0" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#5A6472">不涉及</text><text x="1006.0" y="700.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">• 性能功耗指标（本需求仅承载功能）</text><text x="1006.0" y="740.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">• 应用兼容性（失败降级，不影响启动）</text><text x="1006.0" y="780.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">• 公共 / System API 变更（仅 InnerAPI）</text><rect x="60.0" y="848.0" width="1800.0" height="152.0" fill="#E8F0FE" rx="14" stroke="#2F6FEB" stroke-width="2"/><text x="92.0" y="900.0" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#2F6FEB">关键口径</text><text x="92.0" y="944.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">采集窗口：LoadExtStartupTasks 触发开始，HandleLaunchApplication 完成后 5 秒结束。</text><text x="92.0" y="980.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">预加载 mode（RTLD_NOW / RTLD_LAZY）待与 musl 团队对齐，本轮不写死。</text></svg>