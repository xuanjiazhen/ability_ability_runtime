<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0.0" y="0.0" width="1920.0" height="1080.0" fill="#F5F7FA"/><rect x="0.0" y="0.0" width="1920.0" height="108.0" fill="#E8F0FE"/><rect x="0.0" y="104.0" width="1920.0" height="4.0" fill="#2F6FEB"/><text x="64.0" y="68.0" font-family="Microsoft YaHei" font-size="38" font-weight="bold" fill="#1F2733">方案（采集 → 预测 → 预加载）</text><text x="64.0" y="96.0" font-family="Microsoft YaHei" font-size="20" fill="#5A6472">启动框架消费 predicted，经 napi 预加载系统 so；预加载不注册模块</text><text x="64.0" y="168.0" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#2F6FEB">① 启动早期（非主线程）：预测预加载</text><rect x="60.0" y="200.0" width="360.0" height="132.0" fill="#E8F0FE" rx="12" stroke="#2F6FEB" stroke-width="2"/><text x="172.2" y="244.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">app_startup</text><text x="163.0" y="280.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">预测预加载任务</text><line x1="420.0" y1="266.0" x2="461.0" y2="266.0" stroke="#2F6FEB" stroke-width="3"/><path d="M 485.0 266.0 L 460.0 256.0 L 460.0 276.0 Z" fill="#2F6FEB"/><rect x="485.0" y="200.0" width="330.0" height="132.0" fill="#E8F0FE" rx="12" stroke="#2F6FEB" stroke-width="2"/><text x="581.2" y="244.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">读 predicted</text><text x="595.0" y="280.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">系统模块名</text><line x1="815.0" y1="266.0" x2="856.0" y2="266.0" stroke="#2F6FEB" stroke-width="3"/><path d="M 880.0 266.0 L 855.0 256.0 L 855.0 276.0 Z" fill="#2F6FEB"/><rect x="880.0" y="200.0" width="520.0" height="132.0" fill="#E8F0FE" rx="12" stroke="#2F6FEB" stroke-width="2"/><text x="1021.4" y="244.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">NativeModuleManager</text><text x="983.9" y="280.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">PreloadSystemNativeModule</text><line x1="1400.0" y1="266.0" x2="1441.0" y2="266.0" stroke="#2F6FEB" stroke-width="3"/><path d="M 1465.0 266.0 L 1440.0 256.0 L 1440.0 276.0 Z" fill="#2F6FEB"/><rect x="1465.0" y="200.0" width="380.0" height="132.0" fill="#E4F5EC" rx="12" stroke="#2E9E6B" stroke-width="2"/><text x="1541.6" y="244.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">musl dlopen_preload</text><text x="1547.0" y="280.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">load/link（不注册）</text><text x="64.0" y="376.0" font-family="Microsoft YaHei" font-size="21" fill="#2E9E6B">防自反馈：预加载经 dlopen_preload 只做 load/link、不注册模块 → 不出现在已加载系统模块枚举中，不计为命中。</text><text x="64.0" y="452.0" font-family="Microsoft YaHei" font-size="26" font-weight="bold" fill="#6B4FBB">② 采集窗口：采集 + 预测落盘</text><rect x="60.0" y="484.0" width="360.0" height="132.0" fill="#EDE7FB" rx="12" stroke="#6B4FBB" stroke-width="2"/><text x="120.2" y="528.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">LoadExtStartupTasks</text><text x="196.0" y="564.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">触发开始</text><line x1="420.0" y1="550.0" x2="461.0" y2="550.0" stroke="#6B4FBB" stroke-width="3"/><path d="M 485.0 550.0 L 460.0 540.0 L 460.0 560.0 Z" fill="#6B4FBB"/><rect x="485.0" y="484.0" width="340.0" height="132.0" fill="#EDE7FB" rx="12" stroke="#6B4FBB" stroke-width="2"/><text x="587.2" y="528.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">延时 5 秒调度</text><text x="548.5" y="564.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">CollectAndPersist</text><line x1="825.0" y1="550.0" x2="866.0" y2="550.0" stroke="#6B4FBB" stroke-width="3"/><path d="M 890.0 550.0 L 865.0 540.0 L 865.0 560.0 Z" fill="#6B4FBB"/><rect x="890.0" y="484.0" width="500.0" height="132.0" fill="#EDE7FB" rx="12" stroke="#6B4FBB" stroke-width="2"/><text x="964.5" y="528.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">GetLoadedSystemNativeModules</text><text x="1063.0" y="564.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">枚举系统模块名</text><line x1="1390.0" y1="550.0" x2="1431.0" y2="550.0" stroke="#6B4FBB" stroke-width="3"/><path d="M 1455.0 550.0 L 1430.0 540.0 L 1430.0 560.0 Z" fill="#6B4FBB"/><rect x="1455.0" y="484.0" width="380.0" height="132.0" fill="#FBEFD9" rx="12" stroke="#C97A16" stroke-width="2"/><text x="1580.1" y="528.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">EWMA 合并 +</text><text x="1601.0" y="564.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">原子落盘</text><text x="64.0" y="660.0" font-family="Microsoft YaHei" font-size="21" fill="#6B4FBB">窗口结束时机：HandleLaunchApplication 完成后约 5 秒（由 preload 线程延时任务近似）。</text><rect x="60.0" y="730.0" width="1160.0" height="300.0" fill="#FFFFFF" rx="14" stroke="#D0D7E2" stroke-width="2"/><rect x="60.0" y="730.0" width="1160.0" height="8.0" fill="#2E9E6B" rx="4"/><text x="92.0" y="786.0" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#2E9E6B">③ 落盘与消费</text><text x="92.0" y="838.0" font-family="Microsoft YaHei" font-size="23" fill="#1F2733">&lt;cacheDir&gt;/native_module_collect/</text><text x="92.0" y="878.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">predict.json / collected.json（含 version 字段）</text><text x="92.0" y="928.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">原子写：临时文件 + rename；多实例：跨进程 flock 合并命中</text><text x="92.0" y="978.0" font-family="Microsoft YaHei" font-size="22" fill="#1F2733">下次启动读取 predicted → 逐个预加载系统模块</text><rect x="1250.0" y="730.0" width="610.0" height="300.0" fill="#FFFFFF" rx="14" stroke="#D0D7E2" stroke-width="2"/><rect x="1250.0" y="730.0" width="610.0" height="8.0" fill="#C97A16" rx="4"/><text x="1282.0" y="786.0" font-family="Microsoft YaHei" font-size="25" font-weight="bold" fill="#C97A16">设备差异与开放项</text><circle cx="1290.0" cy="831.3" r="4" fill="#C97A16"/><text x="1308.0" y="838.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">设备开关：系统参数控制，缺省关闭</text><circle cx="1290.0" cy="875.3" r="4" fill="#C97A16"/><text x="1308.0" y="882.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">PC/手机/平板默认支持，其他默认不支持</text><circle cx="1290.0" cy="919.3" r="4" fill="#C97A16"/><text x="1308.0" y="926.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">mode 待与 musl 对齐（RTLD_NOW / RTLD_LAZY）</text><circle cx="1290.0" cy="963.3" r="4" fill="#C97A16"/><text x="1308.0" y="970.0" font-family="Microsoft YaHei" font-size="21" fill="#1F2733">静态 allowlist 预加载仍会计入（已确认接受）</text></svg>