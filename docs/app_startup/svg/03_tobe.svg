  <text x="122" y="176" font-size="22" fill="#475569">去 NAPI 模块化 · ABC 迁入独立内部库；等价性为推断（附前提），验证状态分列已完成/待验证</text>
  <rect x="1300" y="104" width="120" height="36" rx="18" fill="#ECFDF5" stroke="#A7F3D0"/>
