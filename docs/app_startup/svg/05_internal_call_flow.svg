  <text x="1133" y="662" font-size="14" fill="#334155">'use sendable'(:19) 跨线程</text>

  <line x1="1401" y1="614" x2="1435" y2="614" stroke="#94A3B8" stroke-width="3" marker-end="url(#aB)"/>

  <rect x="1442" y="550" width="288" height="128" rx="12" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2" filter="url(#shadow)"/>
