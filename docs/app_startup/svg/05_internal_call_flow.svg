  <rect x="104" y="788" width="216" height="92" rx="10" fill="#F8FAFC" stroke="#C7D2FE"/>
  <text x="124" y="822" font-size="15" font-weight="700" fill="#4F46E5">async_task_*.ts</text>
  <text x="124" y="848" font-size="13" fill="#64748B">excutor / callback 胶水源码</text>
  <text x="124" y="868" font-size="13" fill="#64748B">（appkit/app_startup/）</text>

  <line x1="328" y1="834" x2="356" y2="834" stroke="#94A3B8" stroke-width="3" marker-end="url(#aB)"/>
