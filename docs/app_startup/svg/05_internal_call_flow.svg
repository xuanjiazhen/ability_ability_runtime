  <text x="380" y="848" font-size="13" fill="#64748B">excutor 2212B</text>
  <text x="380" y="868" font-size="13" fill="#64748B">callback 1212B</text>

  <line x1="584" y1="834" x2="612" y2="834" stroke="#94A3B8" stroke-width="3" marker-end="url(#aB)"/>
  <text x="586" y="822" font-size="12" fill="#94A3B8">objcopy</text>

  <rect x="616" y="788" width="216" height="92" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="636" y="822" font-size="15" font-weight="700" fill="#334155">_abc.o 目标文件</text>
  <text x="636" y="848" font-size="13" fill="#64748B">_binary_*_abc_start/_end</text>
  <text x="636" y="868" font-size="13" fill="#64748B">（全局 D 符号）</text>

  <line x1="840" y1="834" x2="868" y2="834" stroke="#94A3B8" stroke-width="3" marker-end="url(#aB)"/>
  <text x="842" y="822" font-size="12" fill="#94A3B8">link</text>

  <rect x="872" y="788" width="224" height="92" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
  <text x="892" y="822" font-size="15" font-weight="700" fill="#059669">内部库 .so</text>
  <text x="892" y="848" font-size="13" fill="#64748B">libappkit_startup_task.z.so</text>
  <text x="892" y="868" font-size="13" fill="#64748B">安装于 platformsdk/</text>

  <text x="120" y="924" font-size="16" fill="#334155">getter 引用 _binary_* 符号（appkit_startup_task.cpp:33-36 extern 声明，:38-52 visibility("default") 导出）</text>
  <text x="120" y="950" font-size="16" fill="#334155">——getter 活引用保证 ABC 数据不被 --gc-sections 裁剪；无 version_script，符号经 llvm-nm -D 验证为全局导出</text>
  <text x="120" y="984" font-size="15" fill="#94A3B8">注：.ts/.abc/.o 为构建中间产物（不进镜像）；镜像制品仅 libappkit_startup_task.z.so（platformsdk）</text>

  <!-- Bottom right: code excerpts -->
  <rect x="1160" y="712" width="680" height="300" rx="16" fill="#0F172A" filter="url(#shadow)"/>
  <text x="1196" y="756" font-size="21" font-weight="700" fill="#E2E8F0">关键源码摘录（可复制核对）</text>
  <text x="1196" y="792" font-size="13" fill="#94A3B8" font-family="ui-monospace, Consolas, monospace">// appkit_startup_task.cpp:38-43（内部库导出）</text>
  <text x="1196" y="814" font-size="13" fill="#7DD3FC" font-family="ui-monospace, Consolas, monospace">extern "C" __attribute__((visibility("default")))</text>
  <text x="1196" y="836" font-size="13" fill="#7DD3FC" font-family="ui-monospace, Consolas, monospace">const uint8_t* GetAsyncTaskExcutorAbc(int32_t* len)</text>
  <text x="1196" y="864" font-size="13" fill="#94A3B8" font-family="ui-monospace, Consolas, monospace">// js_startup_task.cpp:183-189（调用点）</text>
  <text x="1196" y="886" font-size="13" fill="#86EFAC" font-family="ui-monospace, Consolas, monospace">const uint8_t* abcBuf = GetAsyncTaskExcutorAbc(&amp;abcLen);</text>
  <text x="1196" y="908" font-size="13" fill="#86EFAC" font-family="ui-monospace, Consolas, monospace">if (abcBuf == nullptr || abcLen &lt;= 0) { return 16000050; }</text>
  <text x="1196" y="936" font-size="13" fill="#94A3B8" font-family="ui-monospace, Consolas, monospace">// js_startup_task.cpp:189-190 → js_runtime.cpp:632</text>
  <text x="1196" y="958" font-size="13" fill="#FDE68A" font-family="ui-monospace, Consolas, monospace">AsyncTaskExecutorJsRef_ = JsRuntime::LoadInternalModuleByBuffer(</text>
  <text x="1196" y="980" font-size="13" fill="#FDE68A" font-family="ui-monospace, Consolas, monospace">    env, vm, abcBuf, abcLen, "async_task_excutor.abc", ...);</text>
