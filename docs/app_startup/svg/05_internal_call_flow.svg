  <rect x="443" y="550" width="288" height="128" rx="12" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="2" filter="url(#shadow)"/>
  <text x="467" y="588" font-size="20" font-weight="700" fill="#4F46E5">⑦ asyncPushTask</text>
  <text x="467" y="616" font-size="14" fill="#64748B">async_task_excutor.ts:45,31</text>
  <text x="467" y="640" font-size="14" fill="#334155">new taskPool.Task(...)</text>
  <text x="467" y="662" font-size="14" fill="#334155">onReceiveData+execute(:35-37)</text>

