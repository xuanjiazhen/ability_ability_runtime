+void DCameraSinkController::AccSensorCallback(SensorEvent* event)
+{
+    if (event == nullptr) {
+        DHLOGI("event == nullptr");
+        return;
+    }
+    SensorData *data = reinterpret_cast<SensorData*>(event->data);
+    SensorDataInfo accData;
+    accData.timeStamp = event->timestamp;
+    accData.x = static_cast<double>(data->x);
+    accData.y = static_cast<double>(data->y);
+    accData.z = static_cast<double>(data->z);
+    DCameraImuSensor::GetInstance().SendSensorData(SensorTypeId::SENSOR_TYPE_ID_ACCELEROMETER, accData);
+    // DHLOGI("shj acc callback time = %{public}lld, x = %{public}f, y = %{public}f, z = %{public}f, dataLen = %{public}d",
