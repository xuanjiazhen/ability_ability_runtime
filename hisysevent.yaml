+void DCameraSinkController::OpenCl()
+{
+   errno = 0;
+    void* openclHandle = dlopen("/vendor/lib64/libOpenCL.so", RTLD_NOW | RTLD_LOCAL);
+    if(!openclHandle) {
+        DHLOGI("dlopen libOpenCL.so failed! %{public}d", errno);
+        return;
+    }
+	//打印成功日志
+	if (openclHandle == nullptr) {
+        DHLOGI("dlclose libOpenCL.so failed: gOpenclHandle is nullptr!");
+    }
+    if (dlclose(openclHandle) != 0) {
+        DHLOGI("dlclose libOpenCL.so failed!");
+        openclHandle = nullptr;
+        return;
+    }
+    openclHandle = nullptr;
+    DHLOGI("dlclose libOpenCL.so successfully!");
+}
