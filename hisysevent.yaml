(allow storage_daemon unlabeled (filesystem ( unmount )))
(allow storage_daemon storage_daemon (capability ( sys_rawio )))

# avc: denied { unmount } for pid=672, comm="/system/bin/storage_daemon"  scontext=u:r:storage_daemon:s0 tcontext=u:object_r:unlabeled:s0 tclass=filesystem permissive=1
allow storage_daemon unlabeled:filesystem { unmount };

# avc: denied { sys_rawio } for pid=10482, comm="/bin/eject"  capability=17 scontext=u:r:storage_daemon:s0 tcontext=u:r:storage_daemon:s0 tclass=capability permissive=1
allow storage_daemon storage_daemon:capability { sys_rawio };

base/security/selinux_adapter/sepolicy/base/public/filesystem.te
neverallow storage_daemon ~{ exfat vfat ntfs hmdfs sharefs tmpfs labeledfs mnt_external_file unlabeled }:filesystem unmount;

base/security/selinux_adapter/sepolicy/base/public/domain.te 324
neverallow { domain -init -chipset_init -cap_violator_sysrawio -storage_info -storage_daemon } self:{ capability cap_userns } sys_rawio;