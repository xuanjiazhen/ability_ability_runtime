+void DCameraSinkController::UnRegisterSensorListener()
+{
+    DCameraImuSensor::GetInstance().UnInit();
+    int32_t activateRet = DeactivateSensor(SENSOR_TYPE_ID_ACCELEROMETER, &accUser);
+    DHLOGE("shj SENSOR_TYPE_ID_ACCELEROMETER, activateRet: %{public}d", activateRet);
+    int32_t subscribeRet = UnsubscribeSensor(SENSOR_TYPE_ID_ACCELEROMETER, &accUser);
+    DHLOGE("shj SENSOR_TYPE_ID_ACCELEROMETER, subscribeRet: %{public}d", subscribeRet);
+
+    activateRet = DeactivateSensor(SENSOR_TYPE_ID_GYROSCOPE, &gyroUser);
+    DHLOGE("shj SENSOR_TYPE_ID_GYROSCOPE, activateRet: %{public}d", activateRet);
+    subscribeRet = UnsubscribeSensor(SENSOR_TYPE_ID_GYROSCOPE, &gyroUser);
+    DHLOGE("shj SENSOR_TYPE_ID_GYROSCOPE, subscribeRet: %{public}d", subscribeRet);
+    accUser.callback = nullptr;
+    gyroUser.callback = nullptr;
+}
