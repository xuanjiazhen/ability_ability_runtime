+#include "dcamera_imu_sensor.h"
+#include "distributed_hardware_log.h"
+#include "dcamera_softbus_adapter.h"
+
+namespace OHOS {
+namespace DistributedHardware {
+IMPLEMENT_SINGLE_INSTANCE(DCameraImuSensor);
+
+constexpr int64_t POSTURE_INTERVAL = 100000000; // 100ms
+
+DCameraImuSensor::DCameraImuSensor()
+{}
+
+DCameraImuSensor::~DCameraImuSensor()
+{}
+
+void DCameraImuSensor::Init()
+{
+    DHLOGI("shj DCameraImuSensor Init.");
+    eventThread_ = std::thread([this]() { this->StartEventHandler(); });
+    std::unique_lock<std::mutex> lock(eventMutex_);
+    eventCon_.wait(lock, [this] {
+        return eventHandler_ != nullptr;
+    });
+}
+
+void DCameraImuSensor::UnInit()
+{
+    DHLOGI("shj DCameraImuSensor UnInit.");
+    if ((eventHandler_ != nullptr) && (eventHandler_->GetEventRunner() != nullptr)) {
+        eventHandler_->GetEventRunner()->Stop();
+    }
+    if (eventThread_.joinable()) {
+        eventThread_.join();
+    }
+    eventHandler_ = nullptr;
+}
+
+void DCameraImuSensor::StartEventHandler()
+{
+    DHLOGI("shj DCameraImuSensor StartEventHandler.");
+    //prctl(PR_SET_NAME, SINK_START_EVENT.c_str());
+    auto runner = AppExecFwk::EventRunner::Create(false);
+    {
+        std::lock_guard<std::mutex> lock(eventMutex_);
+        eventHandler_ = std::make_shared<AppExecFwk::EventHandler>(runner);
+    }
+    eventCon_.notify_one();
+    runner->Run();
+}
+
+void DCameraImuSensor::SendSensorData(SensorTypeId type, SensorDataInfo data)
+{
+    auto sendFunc = [this, type, data]() mutable {
+        if (type == SensorTypeId::SENSOR_TYPE_ID_ACCELEROMETER) {
+            DCameraSoftbusAdapter::GetInstance().SendSensorAccData(data);
+        } else if (type == SensorTypeId::SENSOR_TYPE_ID_GYROSCOPE) {
+            DCameraSoftbusAdapter::GetInstance().SendSensorGyroData(data);
+        }
+    };
+    if (eventHandler_ != nullptr) {
+        eventHandler_->PostTask(sendFunc);
+    }
+}
+}
