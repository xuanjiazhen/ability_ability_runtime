<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture In Picture Video</title>
</head>

<body>
<div class="container">
    <audio id="myAudio"  controls >
        <source src="01.mp3" type="audio/mp3">
    </audio>
</div>
<style>
    .container {
         position: relative; /* 父元素设为相对定位 */
         height: 100vh; /* 示例：父元素高度为视口高度 */
         border: 1px solid #ccc;
    }
    #myAudio {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%); /* 通过平移自身宽高的50%实现居中 */
        width: 300px;
        height: 100px;
        text-align: center;
        line-height: 100px;
    }
</style>

</body>

</html>
